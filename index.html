<style>
:root{
  --bg:#0f1419; --card:#171d24; --card2:#1c232b; --line:#2a323c;
  --text:#e6edf3; --muted:#8b949e;
  --green:#3fb950; --yellow:#d29922; --red:#f85149; --blue:#58a6ff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;min-height:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.hh{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600}
.hh .who{font-size:11px;color:var(--muted)}
.hh .who b{color:var(--blue)}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;background:transparent;border:0;color:var(--muted);padding:11px 12px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);background:rgba(88,166,255,.05)}
.tab-badge{display:none;background:var(--blue);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px;font-weight:600}
.tab-badge.on{display:inline-block}
.tab-badge.red{background:var(--red)}
main{padding:12px 10px 80px;max-width:1400px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--yellow);display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{background:#232a33}
.btn.primary{background:var(--blue);color:#001a33;border-color:var(--blue);font-weight:600}
.btn.green{background:var(--green);color:#002200;border-color:var(--green);font-weight:600}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{background:#0a0e12;border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:5px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.3px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:12px}
th{background:#141a20;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
tr:hover td{background:#1a2129}
.row-done td{opacity:.55}
.row-done a{}
.pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pill.draft{background:#333a44;color:var(--muted)}
.pill.approved{background:rgba(88,166,255,.15);color:var(--blue)}
.pill.in_progress{background:rgba(210,153,34,.15);color:var(--yellow)}
.pill.awaiting_review{background:rgba(88,166,255,.25);color:var(--blue);font-weight:bold}
.pill.done{background:rgba(63,185,80,.15);color:var(--green)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--muted);font-size:11px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.trip-card{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;transition:.15s}
.trip-card:hover{border-color:var(--blue)}
.trip-card.sel{border-color:var(--blue);background:rgba(88,166,255,.08)}
.tc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tc-date{font-weight:600}
.tc-items{font-size:11px;color:var(--muted)}
.tc-sum{font-weight:600;margin-top:4px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:960px;width:96%;max-height:92vh;overflow:auto}
#modal h3{margin:0 0 12px;font-size:14px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
#toast.on{opacity:.95}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){
  main{padding:8px 6px 80px}
  th,td{padding:5px 4px;font-size:11px}
  .btn{padding:6px 9px;font-size:11px}
  .grid{grid-template-columns:1fr}
  .hide-sm{display:none}
}

<script>
// ================= CONFIG =================
const CFG = {
  url: 'https://mowkvfgxrvfcafuuiaho.supabase.co',
  key: 'sb_publishable_n9b-TOXOCU_ojtb0a_kbyQ_g3odyXIX'
};
const LS = 'evroopt_session_v1';
const LS_CACHE = 'evroopt_cache_v1';

// ================= STATE =================
const S = {
  token: null,
  user: null,
  role: null,
  products: [],
  trips: [],
  tripItems: [],
  wms: {},
  currentTripId: null,
  wizardResult: null,
};

// ================= API =================
async function api(path, opts = {}) {
  const headers = {
    'apikey': CFG.key,
    'Content-Type': 'application/json',
    ...(opts.headers || {})
  };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  if (opts.prefer) headers['Prefer'] = opts.prefer;
  const res = await fetch(CFG.url + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && S.token) {
    // JWT истёк: пробуем refresh и один retry
    try {
      const ok = await refreshIfNeeded();
      if (ok) {
        headers['Authorization'] = 'Bearer ' + S.token;
        const res2 = await fetch(CFG.url + path, {
          method: opts.method || 'GET',
          headers,
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
        if (res2.ok) return res2.status === 204 ? null : res2.json();
        const err2 = await res2.text();
        throw new Error(res2.status + ' ' + err2.slice(0, 300));
      }
    } catch (e) { /* fallthrough to error */ }
    // refresh не помог — logout
    logout();
    throw new Error('401 Unauthorized (session expired)');
  }
  if (!res.ok) {
    const err = await res.text();
    throw new Error(res.status + ' ' + err.slice(0, 300));
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

// ================= AUTH =================
async function login(email, password) {
  const res = await fetch(CFG.url + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': CFG.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  if (!res.ok) throw new Error('Неверный email или пароль');
  const d = await res.json();
  S.token = d.access_token;
  S.user = d.user;
  S.role = (d.user.app_metadata || {}).role || 'buyer';
  localStorage.setItem(LS, JSON.stringify({
    token: d.access_token,
    refresh: d.refresh_token,
    email: d.user.email,
    role: S.role,
    exp: Date.now() + (d.expires_in * 1000) - 60000
  }));
  return d;
}

async function refreshIfNeeded() {
  const raw = localStorage.getItem(LS);
  if (!raw) return false;
  const s = JSON.parse(raw);
  if (!s.token) return false;
  if (s.exp && s.exp > Date.now()) {
    S.token = s.token;
    S.role = s.role;
    S.user = { email: s.email, app_metadata: { role: s.role } };
    return true;
  }
  // нужно обновить
  try {
    const res = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': CFG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh })
    });
    if (!res.ok) throw new Error('refresh failed');
    const d = await res.json();
    S.token = d.access_token;
    S.user = d.user;
    S.role = (d.user.app_metadata || {}).role || 'buyer';
    localStorage.setItem(LS, JSON.stringify({
      token: d.access_token, refresh: d.refresh_token,
      email: d.user.email, role: S.role,
      exp: Date.now() + (d.expires_in * 1000) - 60000
    }));
    return true;
  } catch (e) {
    localStorage.removeItem(LS);
    return false;
  }
}

function logout() {
  S.token = null; S.user = null; S.role = null;
  localStorage.removeItem(LS);
  location.reload();
}

// ================= TOAST / MODAL =================
function toast(msg, ms = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), ms);
}

function modal(html) {
  const m = document.getElementById('modal');
  document.getElementById('modal-box').innerHTML = html;
  m.classList.add('on');
}
function closeModal() {
  document.getElementById('modal').classList.remove('on');
}
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// ================= PWA: SW registration =================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(r => {
      console.log('SW registered:', r.scope);
    }).catch(e => console.warn('SW register failed:', e));
  });
}

// ================= HELPERS =================
function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (+n).toFixed(d);
}
function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}
// ================= DATA LOAD =================
async function loadAll() {
  const [products, trips, items, wms, purchases, mealPlans] = await Promise.all([
    api('/rest/v1/products?select=*&order=name'),
    api('/rest/v1/trips?select=*&order=date.asc'),
    api('/rest/v1/trip_items?select=*'),
    api('/rest/v1/wms?select=*'),
    api('/rest/v1/purchases?select=*'),
    api('/rest/v1/meal_plans?select=*&order=plan_start.desc').catch(() => []),
  ]);
  S.products = products || [];
  S.trips = trips || [];
  S.tripItems = items || [];
  S.purchases = purchases || [];
  S.mealPlans = mealPlans || [];
  S.wms = {};
  for (const w of (wms || [])) S.wms[w.product_id] = +w.have_qty || 0;
  updateBadges();
}

function updateBadges() {
  function set(id, val, red) {
    const el = document.getElementById(id);
    if (!el) return;
    if (!val || val <= 0) { el.classList.remove('on', 'red'); el.textContent = ''; return; }
    el.textContent = val;
    el.classList.add('on');
    if (red) el.classList.add('red'); else el.classList.remove('red');
  }
  // Склад: продуктов с остатком
  const wmsCount = Object.values(S.wms || {}).filter(x => +x > 0).length;
  set('badge-catalog', wmsCount);
  // План: походы в awaiting_review (красный), иначе общее количество
  const awaiting = (S.trips || []).filter(t => t.status === 'awaiting_review').length;
  const totalTrips = (S.trips || []).filter(t => t.status !== 'cancelled').length;
  set('badge-plan', awaiting > 0 ? awaiting : (totalTrips > 0 ? totalTrips : 0), awaiting > 0);
  // Покупки: суммарно purchases
  const pchCount = (S.purchases || []).length;
  set('badge-fact', pchCount);
  // Меню: дней в последнем плане
  let menuDays = 0;
  if (S.mealPlans && S.mealPlans.length) {
    const d = S.mealPlans[0].json_data || {};
    menuDays = (d.days || []).length;
  }
  set('badge-menu', menuDays);
  // Мастер: позиции approved без отчёта (требуют внимания)
  const approvedTrips = (S.trips || []).filter(t => t.status === 'approved').length;
  set('badge-wizard', approvedTrips > 0 ? approvedTrips : 0);
}

function productById(id) { return S.products.find(p => p.id === id); }
function tripById(id) { return S.trips.find(t => t.id === id); }
function itemsByTrip(tid) { return S.tripItems.filter(i => i.trip_id === tid); }

function calcTrip(trip) {
  const items = itemsByTrip(trip.id);
  let plan = 0, fact = 0, bought = 0;
  for (const it of items) {
    plan += +it.plan_price_total || 0;
    bought += it._bought ? 1 : 0;
    fact += it._fact_price || 0;
  }
  return { items, plan, fact, bought, total: items.length };
}

// ================= RENDER: PLAN =================
function renderPlan() {
  const root = document.getElementById('tab-plan');
  const isAdmin = S.role === 'admin';

  // группируем по статусу
  const groups = { draft: [], approved: [], in_progress: [], awaiting_review: [], done: [] };
  for (const t of S.trips) {
    const st = t.status || 'draft';
    if (groups[st]) groups[st].push(t);
  }

  let html = '<div class="card"><h2>📋 Походы <span class="muted" style="font-weight:400">' + S.trips.filter(t => t.status !== 'cancelled').length + '</span></h2>';
  if (isAdmin) {
    html += '<div class="flex" style="margin-bottom:10px;flex-wrap:wrap">';
    html += '<button class="btn primary" id="add-trip-btn">+ Добавить поход</button>';
    html += '<button class="btn" id="reload-btn">🔄 Обновить</button>';
    html += '<button class="btn" id="refresh-all-prices-btn" title="Заменить все цены в черновиках на последние покупки">🔄 Цены</button>';
    html += '<button class="btn red" id="clear-trips-btn">🗑 Очистить походы</button>';
    html += '<button class="btn" id="clear-products-btn" title="Удалить продукты, которые не используются ни в одном походе">🧹 Неисп. продукты</button>';
    html += '</div>';
  }

  const statusNames = { draft: 'Черновик', approved: 'Утверждён', in_progress: 'В процессе', awaiting_review: '⏳ Ждёт проверки', done: 'Завершён' };
  for (const st of ['awaiting_review', 'in_progress', 'approved', 'draft', 'done']) {
    if (!groups[st].length) continue;
    if (st === 'draft' && !isAdmin) continue;
    html += '<h3 style="font-size:12px;margin:14px 0 6px;color:var(--muted)">' + statusNames[st] + ' (' + groups[st].length + ')</h3>';
    html += '<div class="grid">';
    for (const t of groups[st]) {
      const c = calcTrip(t);
      html += '<div class="trip-card" data-trip="' + t.id + '">';
      html += '<div class="tc-h"><span class="tc-date">' + fmtDate(t.date) + '</span><span class="pill ' + st + '">' + statusNames[st] + '</span></div>';
      html += '<div class="tc-items">' + c.items.length + ' поз · план ' + fmt(c.plan) + ' BYN</div>';
      if (t.note) html += '<div class="tc-items" style="color:var(--muted);font-style:italic">' + esc(t.note) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  if (!S.trips.length) html += '<div class="empty">Походов нет. Открой вкладку «Мастер» чтобы создать план.</div>';
  html += '</div>';
  root.innerHTML = html;

  // Бейдж ожидания на вкладке План (admin)
  const awaitingCount = groups.awaiting_review ? groups.awaiting_review.length : 0;
  const planTabBtn = document.querySelector('button[data-tab="plan"]');
  if (planTabBtn) {
    const baseText = '📋 План';
    if (isAdmin && awaitingCount > 0) {
      planTabBtn.innerHTML = baseText + ' <span style="background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px">' + awaitingCount + '</span>';
      planTabBtn.title = awaitingCount + ' поход(ов) ждут проверки';
    } else {
      planTabBtn.textContent = baseText;
      planTabBtn.title = '';
    }
  }

  root.querySelectorAll('.trip-card').forEach(el => {
    el.addEventListener('click', () => openTrip(+el.dataset.trip));
  });
  const addBtn = document.getElementById('add-trip-btn');
  if (addBtn) addBtn.addEventListener('click', addTripModal);
  const reloadBtn = document.getElementById('reload-btn');
  if (reloadBtn) reloadBtn.addEventListener('click', async () => {
    await loadAll(); renderPlan(); toast('Обновлено');
  });
  const refreshAllBtn = document.getElementById('refresh-all-prices-btn');
  if (refreshAllBtn) refreshAllBtn.addEventListener('click', refreshPricesAll);
  const clearBtn = document.getElementById('clear-trips-btn');
  if (clearBtn) clearBtn.addEventListener('click', clearAllTrips);
  const clearProdBtn = document.getElementById('clear-products-btn');
  if (clearProdBtn) clearProdBtn.addEventListener('click', clearUnusedProducts);
}

// ================= TRIP DETAIL =================
async function openTrip(tid) {
  const t = tripById(tid);
  if (!t) return;
  const itemsRaw = itemsByTrip(tid);
  // Сортировка: купленное (bought_qty>0) сверху по алфавиту, некупленное вниз по алфавиту.
  const items = itemsRaw.slice().sort((a, b) => {
    const pa = productById(a.product_id) || { name: '' };
    const pb = productById(b.product_id) || { name: '' };
    const ba = (a.bought_qty && +a.bought_qty > 0) ? 0 : 1;
    const bb = (b.bought_qty && +b.bought_qty > 0) ? 0 : 1;
    if (ba !== bb) return ba - bb;
    return (pa.name || '').localeCompare(pb.name || '', 'ru');
  });
  const isAdmin = S.role === 'admin';
  const isBuyer = S.role === 'buyer';
  const isDraft = t.status === 'draft';
  const isApproved = t.status === 'approved' || t.status === 'in_progress';
  const isReview = t.status === 'awaiting_review';
  const isDone = t.status === 'done';

  // Права редактирования
  const canAdminEdit = isAdmin && isDraft;                                // план
  const canBuyerEdit = isBuyer && isApproved;                             // отметки (сын)
  const canAdminReview = isAdmin && isReview;                             // правки в review
  const canBuy = canBuyerEdit || canAdminReview;                          // поля ввода

  const statusNames = {
    draft: 'Черновик',
    approved: 'Утверждён',
    in_progress: 'В процессе',
    awaiting_review: '⏳ Ждёт проверки',
    done: 'Завершён',
    cancelled: 'Отменён'
  };

  let html = '<h3 style="margin-top:0">Поход ' + fmtDate(t.date) + ' — ' + (statusNames[t.status] || t.status) + '</h3>';
  if (t.note) html += '<p class="muted" style="font-size:11px">' + esc(t.note) + '</p>';

  // Подсказка для buyer в review-режиме
  if (isBuyer && isReview) {
    html += '<div style="padding:10px;background:rgba(210,153,34,0.1);border:1px solid var(--yellow);border-radius:6px;margin-bottom:10px;font-size:12px">';
    html += '⏳ Отправлено родителю на проверку. Можешь <b>отозвать</b> и поправить, если ошибся.';
    html += '</div>';
  }
  if (isAdmin && isReview) {
    html += '<div style="padding:10px;background:rgba(88,166,255,0.1);border:1px solid var(--blue);border-radius:6px;margin-bottom:10px;font-size:12px">';
    html += '📋 Сын отметил покупки. Проверь по чеку, поправь цены/вес → <b>✔ Принять на склад</b>. Или <b>↩ Вернуть сыну</b>.';
    html += '</div>';
  }

  // Кнопки действий — для admin в draft
  if (canAdminEdit) {
    html += '<div class="flex" style="margin:10px 0;flex-wrap:wrap">';
    html += '<button class="btn green" data-act="approve" data-tid="' + tid + '">✅ Утвердить</button>';
    html += '<button class="btn red" data-act="cancel" data-tid="' + tid + '">✖ Отменить</button>';
    html += '<button class="btn" data-act="additem" data-tid="' + tid + '">+ Позиция</button>';
    html += '<button class="btn" data-act="refresh-prices" data-tid="' + tid + '" title="Заменить цены в этом походе на актуальные (из последних покупок)">🔄 Обновить цены</button>';
    html += '</div>';
  }

  // 17B-P0B-RETURN-DRAFT: админ может вернуть approved/in_progress в draft,
  // чтобы добавить/удалить позиции. Не показываем для awaiting_review — там
  // уже «↩ Вернуть сыну» (rejectReview).
  if (isAdmin && isApproved) {
    html += '<div class="flex" style="margin:10px 0;flex-wrap:wrap">';
    html += '<button class="btn red" data-act="return-to-draft" data-tid="' + tid + '" title="Вернуть план в черновики (можно будет добавить/удалить позиции)">↩ Вернуть в черновики</button>';
    html += '</div>';
  }

  // 17B-PLAN-FACT-SPLIT: два отдельных итога — план (фикс) и факт (пересчёт)
  const _isRD = (t.status === 'awaiting_review' || t.status === 'done');
  let planBase = 0, includedCount = 0, factSum = 0, factCount = 0;
  for (const it of items) {
    if (it.hidden) continue;
    includedCount++;
    planBase += +it.plan_price_total || 0;
    if (_isRD) {
      if (it.bought_qty && +it.bought_qty > 0 && it.bought_price != null && it.bought_price !== '') {
        factSum += +it.bought_price || 0;
        factCount++;
      }
    } else {
      if (it.override_buy_qty === 0 || it.override_buy_qty === '0') continue;
      const ov = it.override_buy_qty;
      const buy = (ov !== null && ov !== undefined) ? +ov : (+it.target_qty || 0);
      factSum += buy * (+it.plan_price_per_unit || 0);
      factCount++;
    }
  }

  // ============ DESKTOP ============
  html += '<div class="fact-table-desktop" style="overflow-x:auto"><table style="min-width:720px">';
  html += '<thead><tr>';
  if (canAdminEdit) html += '<th style="width:32px">Вкл</th>';
  html += '<th>Товар</th><th class="hide-sm" title="Что нужно купить по плану">План</th><th class="num" style="width:80px">Купить</th><th class="num hide-sm" title="Остаток на складе">Дома</th><th class="num" title="Сумма: Купить × Цена">Сумма</th><th class="num hide-sm">Актуал.</th>';
  if (canBuy || isReview || isDone) {
    html += '<th class="num" style="width:90px">Факт кол-во</th>';
    html += '<th class="num" style="width:90px">Факт ₽</th>';
    html += '<th class="hide-sm" style="width:80px">Факт вес</th>';
  }
  html += '</tr></thead><tbody>';
  let _dividerShown = false;

  for (const it of items) {
    // 17B-P0A-HIDE-ZERO-OVERRIDE: admin снял «Купить» -> override=0.
    // Для buyer (не может править) такая позиция не должна быть видна.
    if (!canAdminEdit && (it.hidden || (it.override_buy_qty === 0 || it.override_buy_qty === '0'))) continue;
    if (it.hidden && !canAdminEdit) continue;
    const p = productById(it.product_id) || { name: '?', unit: it.unit, search_url: '' };
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buyCalc = (+it.target_qty || 0);   // 17B-COLUMNS-FIX: «Купить» по умолчанию = весь план (раньше: план - склад)
    const buy = (ov !== null && ov !== undefined) ? +ov : buyCalc;
    const isOverride = (ov !== null && ov !== undefined);
    const planAdj = buy * (+it.plan_price_per_unit || 0);
    const bought = (it.bought_qty > 0);
    const done = '';  // п.3: не зачёркиваем купленное
    const hiddenRow = it.hidden ? ' style="opacity:0.35"' : '';

    // п.2: разделитель перед первой некупленной позицией (после купленных)
    if (!bought && !_dividerShown && items.some(x => x.bought_qty && +x.bought_qty > 0)) {
      _dividerShown = true;
      html += '<tr class="divider-row"><td colspan="10" style="border-top:2px solid var(--line);padding:4px 0;text-align:center;color:var(--muted);font-size:10px;letter-spacing:1px">— НЕ КУПЛЕНО —</td></tr>';
    }
    html += '<tr class="' + done + '" data-iid="' + it.id + '"' + hiddenRow + '>';
    if (canAdminEdit) {
      html += '<td><input type="checkbox" data-act="visible" ' + (it.hidden ? '' : 'checked') + '></td>';
    }
    html += '<td><a href="' + esc(p.search_url || '#') + '" target="_blank">' + esc(p.name) + '</a>';
    if (p.brand) html += '<div class="muted" style="font-size:10px">' + esc(p.brand) + '</div></td>';
    html += '<td class="hide-sm">' + fmt(+it.target_qty, 2) + ' ' + esc(it.unit || p.unit || '') + '</td>';
    html += '<td class="num">';
    if (canAdminEdit) {
      html += '<input type="number" step="0.01" style="width:70px;padding:3px;text-align:right" data-act="buy-qty" value="' + fmt(buy, 2) + '">';
    } else {
      html += '<b>' + fmt(buy, 2) + '</b>' + (isOverride ? ' ✎' : '');
    }
    html += '</td>';
    html += '<td class="num hide-sm">' + fmt(have, 2) + '</td>';
    html += '<td class="num">' + fmt(planAdj, 2) + '</td>';

    // Актуальная цена из справочника (если есть)
    const actualPrice = p.last_price_per_unit;
    const actualCell = actualPrice
      ? (Math.abs(actualPrice - it.plan_price_per_unit) > 0.01
          ? '<span style="color:var(--yellow)" title="Цена в плане отличается от последней покупки">' + fmt(actualPrice, 2) + ' ⚠</span>'
          : '<span style="color:var(--green)">' + fmt(actualPrice, 2) + ' ✓</span>')
      : '<span class="muted">—</span>';
    html += '<td class="num hide-sm">' + actualCell + '</td>';

    if (canBuy) {
      // Поля ввода
      html += '<td class="num"><input type="number" step="0.01" style="width:70px;padding:3px;text-align:right" data-act="bought-qty" value="' + (it.bought_qty || '') + '" placeholder="' + fmt(buy, 2) + '"></td>';
      html += '<td class="num"><input type="number" step="0.01" style="width:70px;padding:3px;text-align:right" data-act="bought-price" value="' + (it.bought_price || '') + '" placeholder="' + fmt(planAdj, 2) + '"></td>';
      html += '<td class="hide-sm"><input type="text" style="width:60px;padding:3px" data-act="bought-weight" value="' + esc(it.bought_weight || '') + '" placeholder="' + esc(it.unit || '') + '"></td>';
    } else if (isReview || isDone) {
      // Read-only факт (для buyer в review, для всех в done)
      html += '<td class="num">' + (bought ? fmt(+it.bought_qty, 2) : '—') + '</td>';
      html += '<td class="num">' + (it.bought_price !== null && it.bought_price !== undefined ? fmt(+it.bought_price, 2) : '—') + '</td>';
      html += '<td class="hide-sm">' + esc(it.bought_weight || '—') + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  // ============ MOBILE ============
  html += '<div class="fact-cards-mobile">';
  for (const it of items) {
    // 17B-P0A-HIDE-ZERO-OVERRIDE: то же, что в desktop-цикле
    if (!canAdminEdit && (it.hidden || (it.override_buy_qty === 0 || it.override_buy_qty === '0'))) continue;
    if (it.hidden && !canAdminEdit) continue;
    const p = productById(it.product_id) || { name: '?', unit: it.unit, search_url: '' };
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buy = (ov !== null && ov !== undefined) ? +ov : (+it.target_qty || 0);   // 17B-COLUMNS-FIX
    const planAdj = buy * (+it.plan_price_per_unit || 0);
    const bought = (it.bought_qty > 0);
    const done = '';  // п.3: не зачёркиваем купленное

    html += '<div class="fact-row' + done + '" data-iid="' + it.id + '">';
    html += '<div class="f-check">';
    if (canAdminEdit) {
      html += '<input type="checkbox" data-act="visible" ' + (it.hidden ? '' : 'checked') + ' style="width:22px;height:22px;margin-right:6px" title="Включить в план">';
    }
    if (canBuy) {
      html += '<input type="checkbox" data-act="bought-toggle" ' + (bought ? 'checked' : '') + ' style="width:22px;height:22px">';
    } else if (bought) {
      html += '✓';
    }
    html += '</div>';
    html += '<div class="f-name"><a href="' + esc(p.search_url || '#') + '" target="_blank">' + esc(p.name) + '</a></div>';
    const _planQty = (+it.target_qty || 0);
    html += '<div class="f-meta">План: ' + fmt(_planQty, 2) + ' ' + esc(it.unit || p.unit || '') + ' · Купить: ' + fmt(buy, 2) + ' · ' + fmt(planAdj, 2) + ' BYN</div>';
    // 17B-MOBILE-ADMIN-EDIT: админ в draft правит «Купить» прямо в мобильной карточке.
    // Без этого на телефоне была только галочка «включить/выключить», а число
    // «Купить» оставалось с сервера, и родитель не мог уменьшить объём.
    if (canAdminEdit) {
      html += '<div class="f-inputs">';
      html += '<div><label>Купить (' + esc(it.unit || '') + ')</label><input type="number" step="0.01" data-act="buy-qty" value="' + fmt(buy, 2) + '"></div>';
      html += '</div>';
    }
    if (canBuy) {
      html += '<div class="f-inputs">';
      { const _have = +(S.wms && S.wms[it.product_id] || 0); html += '<div><label>Кол-во (' + esc(it.unit || '') + ')' + (_have > 0 ? ' · на складе: ' + fmt(_have, 2) : '') + '</label><input type="number" step="0.01" data-act="bought-qty" value="' + (it.bought_qty || '') + '" placeholder="' + fmt(buy, 2) + '"></div>'; }
      html += '<div><label>Сумма (BYN)</label><input type="number" step="0.01" data-act="bought-price" value="' + (it.bought_price || '') + '" placeholder="' + fmt(planAdj, 2) + '"></div>';
      /* 17B-MOBILE-WEIGHT-FIX: поле Вес убрано (дублировало Кол-во). bought_weight остаётся в БД (используется submitFact/backfill), но на мобиле не показывается. */
      html += '</div>';
    } else if (isReview || isDone) {
      html += '<div class="f-meta" style="color:var(--green)">Факт: ' + fmt(+it.bought_qty, 2) + ' ' + esc(it.unit || '') + ' · ' + fmt(+it.bought_price, 2) + ' BYN</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  // ============ Итоги + кнопки ============
  html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">';
  html += '<div class="muted" id="trip-totals" style="margin-bottom:10px;font-size:13px" data-plan="' + planBase.toFixed(2) + '" data-count="' + includedCount + '">';
  html += '<div>План: <b>' + fmt(planBase) + ' BYN</b> <span class="muted" style="font-size:11px">(заложено ИИ)</span></div>';
  html += '<div style="margin-top:4px">Факт: <b id="trip-fact-sum" style="color:var(--green)">' + fmt(factSum) + ' BYN</b> <span id="trip-fact-count" class="muted" style="font-size:11px">(' + factCount + ' поз.)</span></div>';
  html += '</div>';

  // Buyer: сохранение на сервер (review)
  if (canBuyerEdit) {
    html += '<button class="btn green modal-save-btn" data-act="submit-fact">📤 Отправить отчёт</button>';
  }

  // Buyer в review: отозвать
  if (isBuyer && isReview) {
    html += '<button class="btn" data-act="buyer-recall" style="margin-top:8px;width:100%">↩ Отозвать (редактировать заново)</button>';
  }

  // Admin в review: принять / вернуть + добавить забытую позицию
  if (canAdminReview) {
    // 17B-P1-REVIEW-ADDITEM: админ может добавить позицию (сын купил сверх плана).
    // addItemModal открывает список продуктов, Insert в trip_items для trip_id.
    html += '<button class="btn" data-act="additem" data-tid="' + tid + '" style="margin-top:8px;width:100%">+ Позиция (купил сверх плана)</button>';
    html += '<button class="btn green modal-save-btn" data-act="approve-to-stock" style="margin-top:8px">✔ Принять на склад</button>';
    html += '<button class="btn" data-act="reject-review" style="margin-top:6px;width:100%">↩ Вернуть сыну</button>';
  }

  // Admin в approved (старый flow): «Перенести на склад» напрямую (без review, если сын не отметил)
  if (isAdmin && isApproved) {
    html += '<button class="btn green modal-save-btn" data-act="force-finish">📦 Завершить напрямую (без review)</button>';
  }

  // Done-поход: purchases без цены/веса — кнопка "Дописать задним числом"
  if (isDone && isAdmin) {
    const tripPurchases = (S.purchases || []).filter(x => x.trip_id === tid);
    const missingPrice = tripPurchases.filter(x => x.price_per_unit === null || x.price_per_unit === undefined).length;
    const tripItems = itemsByTrip(tid);
    const missingWeight = tripItems.filter(x => !x.bought_weight).length;
    if (missingPrice > 0 || missingWeight > 0) {
      html += '<div style="margin-top:8px;padding:8px;background:rgba(210,153,34,0.1);border:1px solid var(--yellow);border-radius:6px;font-size:12px">';
      html += '⚠ Данные приёмки до фикса 16B: без цены ' + missingPrice + ' поз., без веса ' + missingWeight + ' поз. Дозаполни.';
      html += '</div>';
      html += '<button class="btn" data-act="backfill-prices" data-tid="' + tid + '" style="margin-top:6px;width:100%">💰 Дописать цены и вес задним числом</button>';
    }
  }

  html += '<button class="btn" style="margin-top:8px;width:100%" onclick="closeModal()">Закрыть</button>';
  html += '</div>';

  modal(html);
  bindTripModal(tid);
}

// 17B-P2-LIVE-RECALC: единый пересчёт строки + итога без перерендера модалки.
// Вызывается из buy-qty / bought-qty / bought-price / bought-toggle.
function _recalcTripUI(tid) {
  const items = itemsByTrip(tid);
  const t = tripById(tid);
  const _isRD = t && (t.status === 'awaiting_review' || t.status === 'done');
  let planBase = 0, includedCount = 0, factSum = 0, factCount = 0;
  for (const it of items) {
    if (it.hidden) continue;
    includedCount++;
    planBase += +it.plan_price_total || 0;
    if (_isRD) {
      if (it.bought_qty && +it.bought_qty > 0 && it.bought_price != null && it.bought_price !== '') {
        factSum += +it.bought_price || 0;
        factCount++;
      }
    } else {
      if (it.override_buy_qty === 0 || it.override_buy_qty === '0') continue;
      const ov = it.override_buy_qty;
      const buy = (ov !== null && ov !== undefined) ? +ov : (+it.target_qty || 0);
      factSum += buy * (+it.plan_price_per_unit || 0);
      factCount++;
    }
  }
  const totEl = document.getElementById('trip-totals');
  if (totEl) {
    totEl.dataset.plan = planBase.toFixed(2);
    totEl.dataset.count = includedCount;
    totEl.innerHTML =
      '<div>План: <b>' + fmt(planBase) + ' BYN</b> <span class="muted" style="font-size:11px">(заложено ИИ)</span></div>' +
      '<div style="margin-top:4px">Факт: <b id="trip-fact-sum" style="color:var(--green)">' + fmt(factSum) + ' BYN</b> <span id="trip-fact-count" class="muted" style="font-size:11px">(' + factCount + ' поз.)</span></div>';
  }
  // Desktop: обновить td.num[2] (planAdj) для каждой видимой строки
  document.querySelectorAll('tr[data-iid]').forEach(tr => {
    const iid = +tr.dataset.iid;
    const it = items.find(x => x.id === iid);
    if (!it) return;
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buy = (ov !== null && ov !== undefined) ? +ov : (+it.target_qty || 0);   // 17B-COLUMNS-FIX
    const planAdj = buy * (+it.plan_price_per_unit || 0);
    const nums = tr.querySelectorAll('td.num');
    if (nums[2]) nums[2].textContent = fmt(planAdj, 2);
  });
  // Mobile: обновить .f-meta «План: N unit · S BYN» (только если это не «Факт:»-строка)
  document.querySelectorAll('.fact-row[data-iid]').forEach(card => {
    const iid = +card.dataset.iid;
    const it = items.find(x => x.id === iid);
    if (!it) return;
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buy = (ov !== null && ov !== undefined) ? +ov : (+it.target_qty || 0);   // 17B-COLUMNS-FIX
    const planAdj = buy * (+it.plan_price_per_unit || 0);
    const meta = card.querySelector('.f-meta');
    if (meta && !(meta.textContent || '').includes('Факт:')) {
      const _pq = (+it.target_qty || 0);
      meta.textContent = 'План: ' + fmt(_pq, 2) + ' ' + (it.unit || '') + ' · Купить: ' + fmt(buy, 2) + ' · ' + fmt(planAdj, 2) + ' BYN';
    }
  });
}

function bindTripModal(tid) {
  const box = document.getElementById('modal-box');

  // 1) Кнопки действий
  box.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;
    // Пропускаем input-поля — у них свои обработчики
    if (['visible', 'buy-qty', 'bought-qty', 'bought-price', 'bought-weight', 'bought-toggle'].includes(act)) return;

    el.addEventListener('click', async (e) => {
      e.preventDefault();
      if (act === 'approve')       await tripApprove(tid);
      if (act === 'cancel')        await tripCancel(tid);
      if (act === 'additem')       return addItemModal(tid);
      if (act === 'submit-fact')   return submitFact(tid);
      if (act === 'buyer-recall')  return recallReview(tid);
      if (act === 'return-to-draft') return returnToDraft(tid);   // 17B-P0B-RETURN-DRAFT
      if (act === 'approve-to-stock') return approveToStock(tid);
      if (act === 'reject-review') return rejectReview(tid);
      if (act === 'force-finish')  return forceFinish(tid);
      if (act === 'refresh-prices') return refreshPrices(tid);
  if (act === 'backfill-prices') return backfillPrices(tid);
  if (act === 'backfill-save')   return backfillPricesSave(tid);
  if (act === 'backfill-cancel') { closeModal(); return openTrip(tid); }
    });
  });

  // 2) Input-поля
  box.querySelectorAll('input[data-act]').forEach(inp => {
    const act = inp.dataset.act;
    const tr = inp.closest('tr') || inp.closest('.fact-row');
    if (!tr) return;
    const iid = +tr.dataset.iid;
    const it = S.tripItems.find(x => x.id === iid);
    if (!it) return;

    // Чекбокс «видимость» (admin draft)
    if (act === 'visible') {
      inp.addEventListener('change', async () => {
        const newHidden = !inp.checked;
        try {
          await api('/rest/v1/trip_items?id=eq.' + iid, {
            method: 'PATCH', prefer: 'return=minimal',
            body: { hidden: newHidden }
          });
          it.hidden = newHidden;
          tr.style.opacity = newHidden ? '0.35' : '1';
          // Пересчёт итогов: сумма всех не-hidden позиций
          const items2 = itemsByTrip(tid);
          let t2 = 0, c2 = 0;
          for (const it2 of items2) {
            if (it2.hidden) continue;
            const have2 = S.wms[it2.product_id] || 0;
            const ov2 = it2.override_buy_qty;
            const buy2 = (ov2 !== null && ov2 !== undefined) ? +ov2 : (+it2.target_qty || 0);   // 17B-COLUMNS-FIX
            t2 += buy2 * (+it2.plan_price_per_unit || 0);
            c2++;
          }
          const totEl = document.getElementById('trip-totals');
          if (totEl) {
            let txt = 'План: <b>' + fmt(t2) + ' BYN</b>';
            totEl.innerHTML = txt;
            totEl.dataset.plan = t2.toFixed(2);
            totEl.dataset.count = c2;
          }
          toast(newHidden ? 'Скрыто от сына' : 'Показано');
        } catch (e) {
          inp.checked = !inp.checked;
          toast('Ошибка: ' + e.message, 4000);
        }
      });
      return;
    }

    // Buy qty override (admin draft)
    if (act === 'buy-qty') {
      inp.addEventListener('change', async () => {
        const val = inp.value.trim();
        const newVal = val === '' ? null : parseFloat(val);
        // 17B-P0A-HIDE-ZERO-OVERRIDE: admin ввёл 0 -> скрываем от buyer (hidden=true).
        // Если очистил поле (null) — вернём hidden=false, чтобы позиция снова стала видна.
        const patch = { override_buy_qty: newVal };
        if (newVal === 0) patch.hidden = true;
        else if (newVal === null && it.hidden) patch.hidden = false;
        try {
          await api('/rest/v1/trip_items?id=eq.' + iid, {
            method: 'PATCH', prefer: 'return=minimal',
            body: patch
          });
          it.override_buy_qty = newVal;
          if ('hidden' in patch) it.hidden = patch.hidden;
          _recalcTripUI(tid);   // 17B-P2-LIVE-RECALC
          toast('Купить: ' + fmt(newVal, 2) + ('hidden' in patch ? (patch.hidden ? ' (скрыто)' : ' (видно)') : ''));
        } catch (e) {
          toast('Ошибка: ' + e.message, 4000);
        }
      });
      return;
    }

    // Bought-qty / bought-price / bought-weight — локально в памяти, отправится по «Отправить отчёт»
    if (act === 'bought-qty') {
      inp.addEventListener('input', () => {
        it.bought_qty = inp.value === '' ? null : parseFloat(inp.value);
        const tr = inp.closest('tr') || inp.closest('.fact-row');
        if (tr) tr.classList.toggle('row-done', it.bought_qty > 0);
        _recalcTripUI(tid);   // 17B-P2-LIVE-RECALC
      });
      return;
    }
    if (act === 'bought-price') {
      inp.addEventListener('input', () => {
        it.bought_price = inp.value === '' ? null : parseFloat(inp.value);
        _recalcTripUI(tid);   // 17B-P2-LIVE-RECALC
      });
      return;
    }
    if (act === 'bought-weight') {
      inp.addEventListener('input', () => { it.bought_weight = inp.value || null; });
      return;
    }

    // Чекбокс «куплено» в мобильной карточке
    if (act === 'bought-toggle') {
      inp.addEventListener('change', () => {
        if (inp.checked) {
          // при отметке — предзаполняем buy_qty, если пусто
          const have = S.wms[it.product_id] || 0;
          const ov = it.override_buy_qty;
          const buy = (ov !== null && ov !== undefined) ? +ov : (+it.target_qty || 0);   // 17B-COLUMNS-FIX
          if (it.bought_qty === null || it.bought_qty === undefined || it.bought_qty === '') {
            it.bought_qty = buy;
            const qtyInput = tr.querySelector('input[data-act=bought-qty]');
            if (qtyInput && !qtyInput.value) qtyInput.value = fmt(buy, 2);
          }
        } else {
          it.bought_qty = null;
          it.bought_price = null;
          const qtyInput = tr.querySelector('input[data-act=bought-qty]');
          const priceInput = tr.querySelector('input[data-act=bought-price]');
          if (qtyInput) qtyInput.value = '';
          if (priceInput) priceInput.value = '';
        }
        tr.classList.toggle('done', inp.checked);
        _recalcTripUI(tid);   // 17B-P2-LIVE-RECALC
      });
      return;
    }
  });
}

// (функция clearAllTrips вызывается по кнопке)
async function clearAllTrips() {
  if (S.role !== 'admin') { toast('Только для админа'); return; }
  if (S.trips.length === 0) { toast('Нет походов'); return; }

  // Проверим, в каких походах есть purchases — их защитим от массового удаления
  let purchasedTripIds = new Set();
  try {
    const purch = await api('/rest/v1/purchases?select=trip_id');
    for (const p of purch) if (p.trip_id) purchasedTripIds.add(p.trip_id);
  } catch (e) { /* если не смогли — без защиты */ }

  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...S.trips].sort((a, b) => a.date.localeCompare(b.date));
  const minDate = sorted[0]?.date || today;
  const maxDate = sorted[sorted.length - 1]?.date || today;

  modal(`
    <h3 style="margin-top:0">🗑 Удаление походов</h3>
    <p class="muted" style="margin:0 0 12px">Продукты (справочник), покупки и склад НЕ затрагиваются. Удаляются только походы и их позиции.</p>

    <label>Что удалять</label>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--text)">
        <input type="radio" name="clr-mode" value="draft" checked style="width:auto"> Только <b>черновики</b> (draft) — рекомендую
      </label>
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--text)">
        <input type="radio" name="clr-mode" value="range" style="width:auto"> Диапазон дат
      </label>
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--text)">
        <input type="radio" name="clr-mode" value="all" style="width:auto"> ВСЁ (все статусы)
      </label>
    </div>

    <div id="clr-range" style="display:none;margin-bottom:10px">
      <label>С даты (включительно)</label>
      <input type="date" id="clr-from" value="${minDate}" min="${minDate}" max="${maxDate}">
      <label style="margin-top:6px">По дату (включительно)</label>
      <input type="date" id="clr-to" value="${maxDate}" min="${minDate}" max="${maxDate}">
    </div>

    <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;color:var(--yellow);margin-top:8px">
      <input type="checkbox" id="clr-protect" checked style="width:auto">
      Защитить походы с покупками (${purchasedTripIds.size} шт)
    </label>

    <div id="clr-preview" style="margin-top:12px;padding:10px;background:var(--card2);border-radius:6px;font-size:12px"></div>

    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn red" id="clr-confirm">🗑 Удалить</button>
    </div>
  `);

  const box = document.getElementById('modal-box');
  const preview = document.getElementById('clr-preview');
  const rangeBox = document.getElementById('clr-range');

  function calcTargets() {
    const mode = box.querySelector('input[name=clr-mode]:checked').value;
    const protect = document.getElementById('clr-protect').checked;
    let targets = S.trips.slice();
    if (mode === 'draft') {
      targets = targets.filter(t => t.status === 'draft');
    } else if (mode === 'range') {
      const from = document.getElementById('clr-from').value;
      const to = document.getElementById('clr-to').value;
      if (from) targets = targets.filter(t => t.date >= from);
      if (to) targets = targets.filter(t => t.date <= to);
    }
    if (protect) {
      targets = targets.filter(t => !purchasedTripIds.has(t.id));
    }
    return targets;
  }

  function updatePreview() {
    const targets = calcTargets();
    if (!targets.length) {
      preview.innerHTML = '<span style="color:var(--muted)">Нечего удалять по выбранным условиям</span>';
      return;
    }
    const byStatus = {};
    let itemsCount = 0;
    for (const t of targets) {
      byStatus[t.status] = (byStatus[t.status] || 0) + 1;
      itemsCount += (S.tripItems || []).filter(i => i.trip_id === t.id).length;
    }
    const statStr = Object.entries(byStatus).map(([s, n]) => `${s}: ${n}`).join(', ');
    const dates = targets.map(t => t.date).sort();
    preview.innerHTML =
      '<div style="color:var(--red);font-weight:600;margin-bottom:4px">Будет удалено: ' + targets.length + ' походов (' + itemsCount + ' позиций)</div>' +
      '<div class="muted">' + statStr + '</div>' +
      '<div class="muted" style="margin-top:4px">Даты: ' + dates[0] + ' … ' + dates[dates.length-1] + '</div>';
  }

  box.querySelectorAll('input[name=clr-mode]').forEach(r => {
    r.addEventListener('change', () => {
      rangeBox.style.display = (box.querySelector('input[name=clr-mode]:checked').value === 'range') ? 'block' : 'none';
      updatePreview();
    });
  });
  document.getElementById('clr-from').addEventListener('change', updatePreview);
  document.getElementById('clr-to').addEventListener('change', updatePreview);
  document.getElementById('clr-protect').addEventListener('change', updatePreview);
  updatePreview();

  document.getElementById('clr-confirm').addEventListener('click', async () => {
    const targets = calcTargets();
    if (!targets.length) { toast('Нечего удалять'); return; }
    if (!confirm('Удалить ' + targets.length + ' походов? Это необратимо.')) return;

    let deleted = 0;
    let errors = 0;
    for (const t of targets) {
      try {
        await api('/rest/v1/trips?id=eq.' + t.id, { method: 'DELETE' });
        deleted++;
      } catch (e) {
        errors++;
      }
    }
    // Обновить состояние
    const deletedIds = new Set(targets.map(t => t.id));
    S.trips = S.trips.filter(t => !deletedIds.has(t.id));
    S.tripItems = S.tripItems.filter(i => !deletedIds.has(i.trip_id));
    closeModal();
    renderPlan();
    toast('🗑 Удалено ' + deleted + (errors ? ', ошибок: ' + errors : ''));
  });
}

async function clearUnusedProducts() {
  if (S.role !== 'admin') { toast('Только для админа'); return; }
  // Находим products, которые не используются ни в одном trip_item и не в purchases
  try {
    const usedInTrips = await api('/rest/v1/trip_items?select=product_id');
    const usedInPurchases = await api('/rest/v1/purchases?select=product_id');
    const usedIds = new Set([
      ...usedInTrips.map(x => x.product_id),
      ...usedInPurchases.map(x => x.product_id)
    ]);
    const unused = S.products.filter(p => !usedIds.has(p.id));
    if (!unused.length) { toast('Неиспользуемых продуктов нет'); return; }
    const msg = 'Найдено ' + unused.length + ' неиспользуемых продуктов.\n\n' +
                unused.slice(0, 10).map(p => '· ' + p.name).join('\n') +
                (unused.length > 10 ? '\n…и ещё ' + (unused.length - 10) : '') +
                '\n\nУдалить их из справочника?';
    if (!confirm(msg)) return;
    for (const p of unused) {
      await api('/rest/v1/products?id=eq.' + p.id, { method: 'DELETE' });
    }
    S.products = S.products.filter(p => !unused.includes(p));
    toast('🗑 Удалено ' + unused.length + ' продуктов');
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}

async function submitFact(tid) {
  const items = itemsByTrip(tid);
  const marked = items.filter(it => it.bought_qty !== null && it.bought_qty !== undefined && it.bought_qty !== '');

  if (!marked.length) {
    if (!confirm('Ни одна позиция не отмечена (не введено "факт кол-во"). Отправить всё равно?')) return;
  }

  const payload = items.map(it => ({
    trip_item_id: it.id,
    bought_qty: it.bought_qty !== null && it.bought_qty !== undefined && it.bought_qty !== '' ? it.bought_qty : 0,
    bought_price: it.bought_price !== null && it.bought_price !== undefined && it.bought_price !== '' ? it.bought_price : '',
    bought_weight: it.bought_weight || ''
  }));

  try {
    const res = await api('/rest/v1/rpc/buyer_save_fact', {
      method: 'POST',
      body: {
        p_trip_id: tid,
        p_items: payload,
        p_author: S.user?.email

    });
    toast('📤 Отправлено родителю: ' + res.items_saved + ' позиций');
    const t = tripById(tid); if (t) t.status = 'awaiting_review';
    await loadAll();
    closeModal();
    renderPlan();
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}

async function approveToStock(tid) {
  if (!confirm('Принять на склад?\n\nСоздадутся записи в purchases, обновится WMS, поход закроется.')) return;
  try {
    // 1) Сохранить текущие правки admin (цены/вес/кол-во) в trip_items.bought_*
    //    Иначе admin_approve_purchases возьмёт пустой bought_price.
    const items = itemsByTrip(tid);
    const payload = [];
    for (const it of items) {
      const bq = (it.bought_qty === null || it.bought_qty === undefined || it.bought_qty === '') ? null : +it.bought_qty;
      if (bq === null || bq <= 0) continue;
      payload.push({
        trip_item_id: it.id,
        bought_qty: bq,
        bought_price: (it.bought_price === null || it.bought_price === undefined || it.bought_price === '') ? '' : String(it.bought_price),
        bought_weight: it.bought_weight || ''
      });
    }
    if (payload.length > 0) {
      await api('/rest/v1/rpc/buyer_save_fact', {
        method: 'POST',
        body: { p_trip_id: tid, p_items: payload, p_author: S.user?.email }
      });
    }
    // 2) Принять. SQL 005 обновляет products.last_price_per_unit — проверено тестом 2026-11-14.
    const res = await api('/rest/v1/rpc/admin_approve_purchases', {
      method: 'POST',
      body: { p_trip_id: tid, p_author: S.user?.email }
    });
    // 3) Восстановить bought_weight (admin_approve_purchases его очищает, но вес нужен в истории).
    const weightSnapshot = payload.filter(x => x.bought_weight);
    for (const w of weightSnapshot) {
      try {
        await api('/rest/v1/trip_items?id=eq.' + w.trip_item_id, {
          method: 'PATCH',
          body: { bought_weight: w.bought_weight }
        });
      } catch (e) {
        console.warn('weight restore fail', w.trip_item_id, e);
      }
    }
    toast('✅ Принято: ' + res.purchases_created + ' покупок, WMS обновлён, цены в базе обновлены');
    await loadAll();
    closeModal();
    renderPlan();
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}

async function forceFinish(tid) {
  if (!confirm('Завершить поход напрямую?\n\nЭто старый сценарий (без сына). Все позиции с override/формулой → purchases + WMS.')) return;

  // Собираем текущее состояние как "куплено" (все buy_qty)
  const items = itemsByTrip(tid);
  const payload = [];
  for (const it of items) {
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buy = (ov !== null && ov !== undefined) ? +ov : Math.max(0, (+it.target_qty || 0) - have);
    if (buy > 0) {
      payload.push({
        trip_item_id: it.id,
        bought_qty: buy,
        bought_price: it.plan_price_per_unit ? (buy * +it.plan_price_per_unit).toFixed(2) : '',
        bought_weight: ''
      });
    }
  }

  try {
    // 1) сохраняем как "факт"
    await api('/rest/v1/rpc/buyer_save_fact', {
      method: 'POST',
      body: { p_trip_id: tid, p_items: payload, p_author: S.user?.email }
    });
    // 2) сразу принимаем
    const res = await api('/rest/v1/rpc/admin_approve_purchases', {
      method: 'POST',
      body: { p_trip_id: tid, p_author: S.user?.email }
    });
    toast('✅ Завершено: ' + res.purchases_created + ' покупок');
    await loadAll();
    closeModal();
    renderPlan();
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}


async function refreshPrices(tid) {
  if (S.role !== 'admin') { toast('Только для админа'); return; }

  // Сколько позиций нужно обновить?
  const items = itemsByTrip(tid);
  let affected = 0;
  let same = 0;
  for (const it of items) {
    const p = productById(it.product_id);
    if (!p || !p.last_price_per_unit) continue;
    if (Math.abs((+p.last_price_per_unit) - (+it.plan_price_per_unit || 0)) > 0.01) affected++;
    else same++;
  }

  if (affected === 0) {
    toast('Все цены уже актуальны');
    return;
  }

  if (!confirm('Обновить цены в этом походе?\n\nЗаменятся цены только в этом походе (draft). История покупок не тронется.\n\nОбновится позиций: ' + affected + ' из ' + items.length)) return;

  try {
    const res = await api('/rest/v1/rpc/refresh_plan_prices', {
      method: 'POST',
      body: { p_trip_ids: [tid], p_author: S.user?.email }
    });
    toast('🔄 Обновлено цен: ' + res.updated_items);
    await loadAll();
    closeModal();
    openTrip(tid);   // переоткрыть чтобы увидеть изменения
    renderPlan();
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}

// ================= BACKFILL PRICES + WEIGHT (done-поход) =================
async function backfillPrices(tid) {
  const tripPurchases = (S.purchases || []).filter(x => x.trip_id === tid);
  const tripItems = itemsByTrip(tid);
  const itemsByProduct = {};
  for (const it of tripItems) itemsByProduct[it.product_id] = it;

  // Список для заполнения: purchases без цены ИЛИ items без веса
  const rows = [];
  for (const pch of tripPurchases) {
    const it = itemsByProduct[pch.product_id];
    const needPrice = pch.price_per_unit === null || pch.price_per_unit === undefined;
    const needWeight = it && !it.bought_weight;
    if (needPrice || needWeight) {
      rows.push({ pch, it, needPrice, needWeight });
    }
  }

  if (!rows.length) { toast('Нечего дописывать'); return; }

  let html = '<h3 style="margin-top:0">💰 Дописать цены и вес</h3>';
  html += '<p class="muted" style="margin:0 0 10px;font-size:12px">Введи цену за единицу (как в чеке) и вес (если указан на упаковке). Пустые поля пропускаются.</p>';
  html += '<div style="overflow-x:auto"><table style="min-width:100%"><thead><tr><th>Товар</th><th class="num">Кол-во</th><th>Ед.</th><th class="num">Цена / ед.</th><th>Вес</th><th class="num">Сумма</th></tr></thead><tbody>';

  for (let i = 0; i < rows.length; i++) {
    const { pch, it, needPrice, needWeight } = rows[i];
    const p = productById(pch.product_id) || { name: '?' };
    html += '<tr>';
    html += '<td>' + esc(p.name) + '</td>';
    html += '<td class="num">' + fmt(pch.qty, 2) + '</td>';
    html += '<td>' + esc(pch.unit || '') + '</td>';
    html += '<td class="num">';
    if (needPrice) {
      html += '<input type="number" step="0.01" data-bf-ppu="' + pch.id + '" data-pch-qty="' + pch.qty + '" placeholder="цена / ед." style="width:100px;padding:4px;text-align:right">';
    } else {
      html += fmt(pch.price_per_unit, 2) + ' ✓';
    }
    html += '</td>';
    html += '<td>';
    if (needWeight && it) {
      html += '<input type="text" data-bf-weight="' + it.id + '" placeholder="вес" style="width:80px;padding:4px">';
    } else {
      html += esc(it && it.bought_weight || '—') + ' ✓';
    }
    html += '</td>';
    html += '<td class="num" data-bf-sum="' + pch.id + '">—</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  html += '<div class="flex" style="margin-top:14px;gap:6px;flex-wrap:wrap">';
  html += '<button class="btn green" data-act="backfill-save" data-tid="' + tid + '" style="flex:1">💾 Сохранить</button>';
  html += '<button class="btn" data-act="backfill-cancel" data-tid="' + tid + '" style="flex:1">Отмена</button>';
  html += '</div>';
  modal(html);

  // Live update суммы
  document.querySelectorAll('[data-bf-ppu]').forEach(inp => {
    inp.addEventListener('input', () => {
      const pchId = +inp.dataset.bfPpu;
      const qty = +inp.dataset.pchQty;
      const sumEl = document.querySelector('[data-bf-sum="' + pchId + '"]');
      if (sumEl) {
        const ppu = parseFloat(inp.value);
        sumEl.textContent = isFinite(ppu) && ppu > 0 ? fmt(ppu * qty, 2) : '—';
      }
    });
  });
}

async function backfillPricesSave(tid) {
  const tripPurchases = (S.purchases || []).filter(x => x.trip_id === tid);
  const tripItems = itemsByTrip(tid);
  const itemsByProduct = {};
  for (const it of tripItems) itemsByProduct[it.product_id] = it;

  let priceOk = 0, weightOk = 0, fail = 0;

  // 1) Цены
  for (const pch of tripPurchases) {
    const inp = document.querySelector('[data-bf-ppu="' + pch.id + '"]');
    if (!inp) continue;
    const ppu = parseFloat(inp.value);
    if (!isFinite(ppu) || ppu <= 0) continue;
    const total = +(ppu * +pch.qty).toFixed(2);
    try {
      await api('/rest/v1/purchases?id=eq.' + pch.id, {
        method: 'PATCH',
        body: { price_per_unit: ppu, total_price: total }
      });
      // products.last_price_per_unit — только если ещё нет или новый старше
      const cur = productById(pch.product_id);
      const curAt = cur && cur.last_price_at ? new Date(cur.last_price_at).getTime() : 0;
      const pchAt = pch.bought_at ? new Date(pch.bought_at).getTime() : Date.now();
      if (!cur || !cur.last_price_per_unit || pchAt >= curAt) {
        await api('/rest/v1/products?id=eq.' + pch.product_id, {
          method: 'PATCH',
          body: { last_price_per_unit: ppu, last_price_at: pch.bought_at || new Date().toISOString() }
        });
      }
      priceOk++;
    } catch (e) {
      console.warn('backfill price fail', pch.id, e);
      fail++;
    }
  }

  // 2) Вес — в trip_items.bought_weight
  for (const it of tripItems) {
    const inp = document.querySelector('[data-bf-weight="' + it.id + '"]');
    if (!inp) continue;
    const w = inp.value.trim();
    if (!w) continue;
    try {
      await api('/rest/v1/trip_items?id=eq.' + it.id, {
        method: 'PATCH',
        body: { bought_weight: w }
      });
      weightOk++;
    } catch (e) {
      console.warn('backfill weight fail', it.id, e);
      fail++;
    }
  }

  toast('✅ Цен: ' + priceOk + ' · вес: ' + weightOk + (fail ? ' · ошибок: ' + fail : ''));
  await loadAll();
  closeModal();
  openTrip(tid);
}


// ===== 17B-P0B-RETURN-DRAFT: админ возвращает approved/in_progress -> draft =====
async function returnToDraft(tid) {
  if (S.role !== 'admin') { toast('Только для админа'); return; }
  const t = tripById(tid);
  if (!t) { toast('Поход не найден'); return; }
  if (t.status !== 'approved' && t.status !== 'in_progress') {
    toast('Вернуть в черновики можно только утверждённый план');
    return;
  }
  // Проверим: есть ли уже факт от buyer (bought_*)
  const items = itemsByTrip(tid);
  const withFact = items.filter(it => it.bought_qty !== null && it.bought_qty !== undefined && +it.bought_qty > 0);
  let msg = 'Вернуть план в черновики?\n\nПосле возврата можно будет добавить/удалить позиции, потом снова утвердить.';
  if (withFact.length) {
    msg = '⚠ ВНИМАНИЕ: buyer уже ввёл факт по ' + withFact.length + ' поз.\n\n' +
          'Если вернёшь в черновики — статус станет draft, но факт в trip_items.bought_* останется. ' +
          'При следующем аппруве факт не сбросится. Точно вернуть?\n\n' + msg;
  }
  if (!confirm(msg)) return;
  try {
    await api('/rest/v1/trips?id=eq.' + tid, {
      method: 'PATCH', prefer: 'return=minimal',
      body: { status: 'draft', approved_at: null, approved_by: null }
    });
    toast('↩ План возвращён в черновики');
    await loadAll();
    closeModal();
    renderPlan();
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}
