async function renderAudit() {
  const root = document.getElementById('tab-audit');
  root.innerHTML = '<div class="card"><h2>📊 Аудит</h2><div class="empty">Загрузка...</div></div>';
  try {
    const purchases = await api('/rest/v1/purchases?select=*&order=bought_at.desc&limit=2000');
    const total = purchases.reduce((s, p) => s + (+p.total_price || 0), 0);
    const byMonth = {};
    for (const p of purchases) {
      const m = (p.bought_at || '').slice(0, 7);
      if (!m) continue;
      byMonth[m] = byMonth[m] || { sum: 0, count: 0 };
      byMonth[m].sum += +p.total_price || 0;
      byMonth[m].count++;
    }
    const byProduct = {};
    for (const p of purchases) {
      byProduct[p.product_id] = byProduct[p.product_id] || { sum: 0, count: 0 };
      byProduct[p.product_id].sum += +p.total_price || 0;
      byProduct[p.product_id].count++;
    }
    const topProducts = Object.entries(byProduct)
      .map(([pid, v]) => ({ pid: +pid, ...v }))
      .sort((a, b) => b.sum - a.sum).slice(0, 10);

    let html = '<div class="card"><h2>📊 Аудит <span class="muted" style="font-weight:400">' + purchases.length + ' покупок всего</span></h2>';
    html += '<div class="grid">';
    html += '<div class="trip-card"><div class="tc-items">Потрачено всего</div><div class="tc-sum">' + fmt(total) + ' BYN</div></div>';
    html += '<div class="trip-card"><div class="tc-items">Месяцев с покупками</div><div class="tc-sum">' + Object.keys(byMonth).length + '</div></div>';
    html += '<div class="trip-card"><div class="tc-items">Уникальных продуктов</div><div class="tc-sum">' + Object.keys(byProduct).length + '</div></div>';
    html += '</div>';

    if (Object.keys(byMonth).length) {
      html += '<h3 style="font-size:12px;margin:14px 0 6px;color:var(--muted)">По месяцам</h3>';
      html += '<table><thead><tr><th>Месяц</th><th class="num">Покупок</th><th class="num">Сумма</th></tr></thead><tbody>';
      for (const [m, v] of Object.entries(byMonth).sort().reverse()) {
        html += '<tr><td>' + esc(m) + '</td><td class="num">' + v.count + '</td><td class="num">' + fmt(v.sum) + ' BYN</td></tr>';
      }
      html += '</tbody></table>';
    }

    if (topProducts.length) {
      html += '<h3 style="font-size:12px;margin:14px 0 6px;color:var(--muted)">Топ-10 продуктов по тратам</h3>';
      html += '<table><thead><tr><th>Продукт</th><th class="num">Раз</th><th class="num">Сумма</th></tr></thead><tbody>';
      for (const tp of topProducts) {
        const p = productById(tp.pid) || { name: '#' + tp.pid };
        html += '<tr><td>' + esc(p.name) + '</td><td class="num">' + tp.count + '</td><td class="num">' + fmt(tp.sum) + ' BYN</td></tr>';
      }
      html += '</tbody></table>';
    }

    html += '<div class="flex" style="margin-top:14px">';
    html += '<button class="btn primary" id="audit-csv">📥 Экспорт purchases.csv</button>';
    html += '<button class="btn" id="audit-json">📥 Экспорт audit.json для ИИ</button>';
    html += '</div></div>';
    root.innerHTML = html;

    // 17B-AUDIT-EXT: диапазон дат + расширенный анализ
    html += '<div class="card" style="margin-top:14px">';
    html += '<h2>🔍 Анализ по диапазону <span class="muted" style="font-weight:400">самый дорогой · тяжёлый · частый · средний чек</span></h2>';
    html += '<div class="row" style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px">';
    html += '<label>С <input type="date" id="audit-from" style="padding:4px 6px"></label>';
    html += '<label>По <input type="date" id="audit-to" style="padding:4px 6px"></label>';
    html += '<button class="btn primary" id="audit-apply">Применить</button>';
    html += '<button class="btn" id="audit-clear">Сброс</button>';
    html += '<span class="muted" id="audit-range-info"></span>';
    html += '</div>';
    html += '<div id="audit-ext-body" class="muted">Выбери диапазон и нажми «Применить». Пустые поля = вся история.</div>';
    html += '</div>';
    root.innerHTML = html;

    // 17B-AUDIT-EXT: хелперы + логика
    function _toGrams(qty, unit) {
      if (!qty || !unit) return 0;
      const u = String(unit).toLowerCase();
      if (u === 'кг') return +qty * 1000;
      if (u === 'г') return +qty;
      if (u === 'л') return +qty * 1000;
      if (u === 'мл') return +qty;
      return null;   // шт/уп - не масса
    }

    function _calcRange() {
      const fromEl = document.getElementById('audit-from');
      const toEl = document.getElementById('audit-to');
      const from = fromEl && fromEl.value ? fromEl.value : null;
      const to = toEl && toEl.value ? toEl.value : null;
      const f = purchases.filter(p => {
        const d = (p.bought_at || '').slice(0, 10);
        if (!d) return false;
        if (from && d < from) return false;
        if (to && d > to) return false;
        return true;
      });
      const totalSum = f.reduce((s, p) => s + (+p.total_price || 0), 0);
      const n = f.length;
      const avgCheck = n ? totalSum / n : 0;

      const byP = {};
      for (const p of f) {
        const pid = p.product_id;
        if (!byP[pid]) byP[pid] = { pid, sum: 0, count: 0, qty: 0, mass: 0, unit: p.unit, priceMax: 0 };
        byP[pid].sum += +p.total_price || 0;
        byP[pid].count++;
        byP[pid].qty += +p.qty || 0;
        const g = _toGrams(p.qty, p.unit);
        if (g != null) byP[pid].mass += g;
        const ppu = +p.price_per_unit || 0;
        if (ppu > byP[pid].priceMax) byP[pid].priceMax = ppu;
        if (!byP[pid].unit) byP[pid].unit = p.unit;
      }
      const arr = Object.values(byP);

      const topPrice = arr.slice().filter(x => x.priceMax > 0).sort((a, b) => b.priceMax - a.priceMax).slice(0, 10);
      const topMass = arr.slice().filter(x => x.mass > 0).sort((a, b) => b.mass - a.mass).slice(0, 10);
      const topFreq = arr.slice().sort((a, b) => b.count - a.count).slice(0, 10);
      const topSum = arr.slice().sort((a, b) => b.sum - a.sum).slice(0, 10);

      return { from, to, n, totalSum, avgCheck, topPrice, topMass, topFreq, topSum };
    }

    function _renderExt() {
      const body = document.getElementById('audit-ext-body');
      const info = document.getElementById('audit-range-info');
      if (!body) return;
      const r = _calcRange();
      const rangeTxt = (r.from || '—') + ' … ' + (r.to || '—');
      if (info) info.textContent = rangeTxt + ' · ' + r.n + ' покупок';
      if (!r.n) { body.innerHTML = '<div class="empty">В этом диапазоне нет покупок</div>'; return; }

      let h = '';
      h += '<div class="grid">';
      h += '<div class="trip-card"><div class="tc-items">Суммарный расход</div><div class="tc-sum">' + fmt(r.totalSum) + ' BYN</div></div>';
      h += '<div class="trip-card"><div class="tc-items">Средний чек</div><div class="tc-sum">' + fmt(r.avgCheck) + ' BYN</div></div>';
      h += '<div class="trip-card"><div class="tc-items">Покупок</div><div class="tc-sum">' + r.n + '</div></div>';
      h += '</div>';

      function _tbl(title, arr, valFmt, valHeader) {
        if (!arr.length) return '';
        let t = '<h3 style="font-size:12px;margin:14px 0 6px;color:var(--muted)">' + title + '</h3>';
        t += '<table><thead><tr><th>#</th><th>Продукт</th><th class="num">' + valHeader + '</th><th class="num">Сумма</th><th class="num">Раз</th></tr></thead><tbody>';
        let i = 1;
        for (const x of arr) {
          const p = productById(x.pid) || { name: '#' + x.pid };
          t += '<tr><td>' + i + '</td><td>' + esc(p.name) + '</td><td class="num">' + valFmt(x) + '</td><td class="num">' + fmt(x.sum) + '</td><td class="num">' + x.count + '</td></tr>';
          i++;
        }
        t += '</tbody></table>';
        return t;
      }

      h += _tbl('💎 Самый дорогой (по макс. цене за ед.)', r.topPrice, x => fmt(x.priceMax) + ' BYN/' + esc(x.unit || ''), 'Цена');
      h += _tbl('⚖️ Самый тяжёлый (по массе, кг/л/г/мл)', r.topMass, x => (x.mass >= 1000 ? (x.mass / 1000).toFixed(2) + ' кг' : x.mass.toFixed(0) + ' г'), 'Масса');
      h += _tbl('🔁 Самый частый (по кол-ву покупок)', r.topFreq, x => x.count + ' раз', 'Частота');
      h += _tbl('💰 Самый дорогой по сумме', r.topSum, x => fmt(x.sum) + ' BYN', 'Сумма');

      body.innerHTML = h;
    }

    document.getElementById('audit-apply').addEventListener('click', _renderExt);
    document.getElementById('audit-clear').addEventListener('click', () => {
      document.getElementById('audit-from').value = '';
      document.getElementById('audit-to').value = '';
      _renderExt();
    });
    _renderExt();
    document.getElementById('audit-csv').addEventListener('click', () => {
      let csv = 'date,product,qty,unit,price_per_unit,total,bought_by\n';
      for (const p of purchases) {
        const prod = productById(p.product_id) || { name: '#' + p.product_id };
        csv += [p.bought_at, '"' + (prod.name || '') + '"', p.qty, p.unit, p.price_per_unit, p.total_price, p.bought_by].join(',') + '\n';
      }
      download(csv, 'purchases_' + new Date().toISOString().slice(0, 10) + '.csv', 'text/csv');
    });
    document.getElementById('audit-json').addEventListener('click', () => {
      const data = {
        generated: new Date().toISOString(),
        total_byn: total,
        by_month: byMonth,
        top_products: topProducts.map(tp => ({
          name: (productById(tp.pid) || {}).name || ('#' + tp.pid),
          sum: tp.sum, count: tp.count
        })),
        wms_current: Object.entries(S.wms).filter(([k, v]) => v > 0).map(([k, v]) => ({
          product: (productById(+k) || {}).name || ('#' + k),
          have: v
        })),
        purchases_recent: purchases.slice(0, 200)
      };
      download(JSON.stringify(data, null, 2), 'audit_' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
    });
  } catch (e) {
    root.innerHTML = '<div class="card"><h2>📊 Аудит</h2><div class="empty">Ошибка: ' + esc(e.message) + '</div></div>';
  }
}

function download(text, filename, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// ================= RENDER: CATALOG =================
// ============================================================
// CATALOG: объединённое дерево "Категория → Продукт"
// ============================================================

let catalogState = {
  collapsed: {},   // { "молочка": true, "бакалея": false }
  search: '',
  onlyStock: false,   // п.7: показывать только в наличии
};

function renderCatalog() {
  if (S.role !== 'admin') {
    document.getElementById('tab-catalog').innerHTML =
      '<div class="card"><h2>🏠 Склад</h2><div class="empty">Только для админа</div></div>';
    return;
  }
  const root = document.getElementById('tab-catalog');

  // Соберём статистику использования
  const usage = {};
  for (const ti of S.tripItems) {
    usage[ti.product_id] = usage[ti.product_id] || { tripItems: 0, purchases: 0 };
    usage[ti.product_id].tripItems++;
  }

  // Группируем по категориям
  const groups = {};
  for (const p of S.products) {
    const cat = (p.category || 'прочее').trim().toLowerCase();
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(p);
  }
  // Сортируем продукты внутри категорий
  for (const cat of Object.keys(groups)) {
    groups[cat].sort((a, b) => a.name.localeCompare(b.name));
  }
  // Сортируем категории
  const catOrder = ['бакалея', 'молочка', 'мясо', 'овощи', 'фрукты', 'хлеб', 'прочее'];
  const catKeys = Object.keys(groups).sort((a, b) => {
    const ia = catOrder.indexOf(a), ib = catOrder.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });

  const totalProducts = S.products.length;
  const totalWithStock = Object.values(S.wms).filter(x => x > 0).length;

  let html = '<div class="card">';
  html += '<h2>🏠 Склад <span class="muted" style="font-weight:400">' + totalProducts + ' продуктов · ' + totalWithStock + ' на складе</span></h2>';
  html += '<p class="muted" style="margin:0 0 10px">Древовидный список по категориям. Склад редактируется прямо здесь. Клик по продукту — расширенное редактирование.</p>';
  html += '<div class="flex" style="margin-bottom:10px;gap:6px">';
  html += '<input type="text" id="cat-filter" placeholder="Поиск..." value="' + esc(catalogState.search) + '" style="flex:1;min-width:120px">';
  html += '<label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap"><input type="checkbox" id="cat-only-stock" ' + (catalogState.onlyStock ? 'checked' : '') + '> Только в наличии</label>';
  html += '<button class="btn" id="cat-reload">🔄</button>';
  html += '<button class="btn" id="cat-expand">▾ Развернуть</button>';
  html += '<button class="btn" id="cat-collapse">▸ Свернуть</button>';
  html += '</div>';

  if (!totalProducts) {
    html += '<div class="empty">Склад пуст</div>';
  } else {
    for (const cat of catKeys) {
      const items = groups[cat];
      const isCollapsed = catalogState.collapsed[cat] === true;

      // Фильтр по поиску — если ни один продукт не подходит, скрываем всю категорию
      const q = catalogState.search.toLowerCase().trim();
      let filtered = q
        ? items.filter(p => p.name.toLowerCase().includes(q) || (p.brand || '').toLowerCase().includes(q))
        : items;
      if (catalogState.onlyStock) filtered = filtered.filter(p => (S.wms[p.id] || 0) > 0);
      if (filtered.length === 0 && (q || catalogState.onlyStock)) continue;

      const catIcon = catIconFor(cat);
      const stockInGroup = filtered.filter(p => (S.wms[p.id] || 0) > 0).length;

      html += '<div class="cat-group" style="margin-bottom:8px">';
      html += '<div class="cat-header" data-cat="' + esc(cat) + '" style="cursor:pointer;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:10px;user-select:none">';
      html += '<span style="font-size:16px">' + catIcon + '</span>';
      html += '<b style="flex:1;text-transform:capitalize">' + esc(cat) + '</b>';
      html += '<span class="muted" style="font-size:11px">' + filtered.length + ' · на складе: ' + stockInGroup + '</span>';
      html += '<span style="font-size:14px;color:var(--muted)">' + (isCollapsed ? '▸' : '▾') + '</span>';
      html += '</div>';

      if (!isCollapsed) {
        html += '<div class="cat-body" style="margin-top:6px;margin-left:10px">';
        html += '<div style="overflow-x:auto"><table style="min-width:520px"><thead><tr>';
        html += '<th>Продукт</th><th>Ед.</th><th class="num">Склад</th><th class="num hide-sm">Цена</th><th class="num">Поз.</th><th></th>';
        html += '</tr></thead><tbody>';

        for (const p of filtered) {
          const u = usage[p.id] || { tripItems: 0 };
          const wmsQty = S.wms[p.id] || 0;
          const hasStock = wmsQty > 0;
          html += '<tr data-pid="' + p.id + '">';
          html += '<td><b>' + esc(p.name) + '</b>' + (p.brand ? '<div class="muted" style="font-size:10px">' + esc(p.brand) + '</div>' : '') + '</td>';
          html += '<td style="color:var(--yellow)">' + esc(p.unit) + '</td>';
          html += '<td class="num">';
          html += '<input type="number" step="0.001" value="' + (wmsQty || '') + '" placeholder="0" data-wms-pid="' + p.id + '" style="width:80px;padding:3px 5px;text-align:right;' + (hasStock ? 'color:var(--green)' : '') + '">';
          html += '</td>';
          const lastPriceStr = p.last_price_per_unit ? fmt(p.last_price_per_unit, 2) + ' / ' + esc(p.unit) : '—';
          html += '<td class="num hide-sm" style="color:' + (p.last_price_per_unit ? 'var(--green)' : 'var(--muted)') + '">' + lastPriceStr + '</td>';
          html += '<td class="num">' + u.tripItems + '</td>';
          html += '<td><button class="btn sm" data-edit="' + p.id + '">✏️</button></td>';
          html += '</tr>';
        }
        html += '</tbody></table></div>';
        html += '</div>';
      }
      html += '</div>';
    }
  }
  html += '</div>';
  root.innerHTML = html;

  // Чекбокс "Только в наличии" (п.7)
  const cbStock = document.getElementById('cat-only-stock');
  if (cbStock) {
    cbStock.addEventListener('change', () => {
      catalogState.onlyStock = cbStock.checked;
      renderCatalog();
    });
  }

  // Поиск
  const filter = document.getElementById('cat-filter');
  filter.addEventListener('input', () => {
    catalogState.search = filter.value;
    // Быстрый перерендер без потери фокуса
    const pos = filter.selectionStart;
    renderCatalog();
    const newFilter = document.getElementById('cat-filter');
    if (newFilter) {
      newFilter.focus();
      newFilter.setSelectionRange(pos, pos);
    }
  });

  // Reload
  document.getElementById('cat-reload').addEventListener('click', async () => {
    await loadAll(); renderCatalog(); toast('Обновлено');
  });

  // Expand/Collapse
  document.getElementById('cat-expand').addEventListener('click', () => {
    catalogState.collapsed = {};
    renderCatalog();
  });
  document.getElementById('cat-collapse').addEventListener('click', () => {
    for (const p of S.products) {
      const cat = (p.category || 'прочее').trim().toLowerCase();
      catalogState.collapsed[cat] = true;
    }
    renderCatalog();
  });

  // Клик по заголовку категории — toggle
  root.querySelectorAll('.cat-header').forEach(h => {
    h.addEventListener('click', () => {
      const cat = h.dataset.cat;
      catalogState.collapsed[cat] = !catalogState.collapsed[cat];
      renderCatalog();
    });
  });

  // Изменение остатка на складе
  root.querySelectorAll('input[data-wms-pid]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const pid = +inp.dataset.wmsPid;
      const newVal = +inp.value || 0;
      const oldVal = S.wms[pid] || 0;
      const delta = newVal - oldVal;
      if (delta === 0) return;
      try {
        await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: {
            p_product_id: pid, p_delta: delta,
            p_reason: 'manual_edit', p_source: 'catalog_tab',
            p_author: S.user?.email
          }
        });
        S.wms[pid] = newVal;
        inp.style.color = newVal > 0 ? 'var(--green)' : '';
        toast('OK: ' + (delta > 0 ? '+' : '') + fmt(delta, 3));
      } catch (e) {
        inp.value = oldVal;
        toast('Ошибка: ' + e.message, 4000);
      }
    });
  });

  // Редактирование продукта
  root.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      editProduct(+b.dataset.edit);
    });
  });
}

function catIconFor(cat) {
  const icons = {
    'бакалея': '🌾',
    'молочка': '🥛',
    'мясо': '🍖',
    'овощи': '🥕',
    'фрукты': '🍎',
    'хлеб': '🍞',
    'прочее': '📦',
  };
  return icons[cat] || '📁';
}

// ================= EDIT PRODUCT =================
function editProduct(pid) {
  const p = S.products.find(x => x.id === pid);
  if (!p) return;

  const tiCount = S.tripItems.filter(i => i.product_id === pid).length;
  const wmsQty = S.wms[pid] || 0;
  const units = ['кг', 'л', 'шт', 'уп'];
  const commonCategories = ['бакалея', 'молочка', 'мясо', 'овощи', 'фрукты', 'хлеб', 'прочее'];

  // Список всех категорий (включая редкие, что уже есть)
  const allCats = new Set(commonCategories);
  for (const x of S.products) if (x.category) allCats.add(x.category.trim().toLowerCase());
  const cats = [...allCats].sort();

  modal(`
    <h3 style="margin-top:0">✏️ Редактировать продукт</h3>

    <label>Название</label>
    <input type="text" id="ep-name" value="${esc(p.name)}">

    <label>Бренд</label>
    <input type="text" id="ep-brand" value="${esc(p.brand || '')}" placeholder="—">

    <label>Категория</label>
    <div style="display:flex;gap:6px">
      <select id="ep-category" style="flex:1">
        ${cats.map(c => `<option value="${esc(c)}" ${c === (p.category || 'прочее').trim().toLowerCase() ? 'selected' : ''}>${catIconFor(c)} ${esc(c)}</option>`).join('')}
        <option value="__custom__">➕ Другая...</option>
      </select>
    </div>
    <input type="text" id="ep-category-custom" placeholder="Новая категория" style="display:none;margin-top:6px">

    <label style="margin-top:10px">Единица учёта</label>
    <select id="ep-unit">
      ${units.map(u => `<option value="${u}" ${u === p.unit ? 'selected' : ''}>${u}</option>`).join('')}
    </select>

    <label style="margin-top:10px">Коэффициент пересчёта (если сменил единицу)</label>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="muted">1 <b>${esc(p.unit)}</b> =</span>
      <input type="number" step="0.001" id="ep-coef" value="1" style="width:90px">
      <span id="ep-coef-unit" class="muted">${esc(p.unit)}</span>
    </div>
    <div class="muted" style="font-size:10px;margin-top:2px">Если единицу не меняешь — оставь 1</div>

    <label style="margin-top:10px">Остаток на складе</label>
    <input type="number" step="0.001" id="ep-wms" value="${wmsQty || 0}">

    <label style="margin-top:10px">Актуальная цена за 1 ${esc(p.unit)} (BYN)</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" step="0.01" id="ep-last-price" value="${p.last_price_per_unit || ''}" placeholder="—" style="flex:1">
      ${p.last_price_at ? `<span class="muted" style="font-size:10px;white-space:nowrap">от ${new Date(p.last_price_at).toLocaleDateString('ru-RU')}</span>` : ''}
    </div>
    <div class="muted" style="font-size:10px;margin-top:2px">Используется как подсказка в планах. Обновляется автоматически при приёмке покупок.</div>

    <div id="ep-preview" style="margin-top:12px;padding:10px;background:var(--card2);border-radius:6px;font-size:12px">
      <div class="muted">Позиций в походах: ${tiCount} · в покупках: будет проверено при удалении</div>
    </div>

    <div style="margin-top:14px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
      <button class="btn red" id="ep-delete">🗑 Удалить</button>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn primary" id="ep-apply">💾 Сохранить</button>
      </div>
    </div>
  `);

  const box = document.getElementById('modal-box');
  const nameInput = box.querySelector('#ep-name');
  const brandInput = box.querySelector('#ep-brand');
  const catSelect = box.querySelector('#ep-category');
  const catCustom = box.querySelector('#ep-category-custom');
  const unitSelect = box.querySelector('#ep-unit');
  const coefInput = box.querySelector('#ep-coef');
  const coefUnit = box.querySelector('#ep-coef-unit');
  const wmsInput = box.querySelector('#ep-wms');
  const lastPriceInput = box.querySelector('#ep-last-price');
  const preview = box.querySelector('#ep-preview');

  // Показать поле "новая категория" если выбрано __custom__
  catSelect.addEventListener('change', () => {
    catCustom.style.display = catSelect.value === '__custom__' ? 'block' : 'none';
    updatePreview();
  });
  unitSelect.addEventListener('change', () => {
    coefUnit.textContent = unitSelect.value;
    updatePreview();
  });
  coefInput.addEventListener('input', updatePreview);
  wmsInput.addEventListener('input', updatePreview);

  function updatePreview() {
    const newUnit = unitSelect.value;
    const coef = parseFloat(coefInput.value) || 1;
    const newCat = catSelect.value === '__custom__' ? (catCustom.value || 'прочее') : catSelect.value;
    const newWms = parseFloat(wmsInput.value) || 0;
    const changes = [];

    if (nameInput.value.trim() !== p.name) changes.push('название');
    if ((brandInput.value.trim() || '') !== (p.brand || '')) changes.push('бренд');
    if (newCat !== (p.category || 'прочее').trim().toLowerCase()) changes.push('категория: ' + (p.category || '—') + ' → ' + newCat);
    if (newUnit !== p.unit) changes.push('единица: ' + p.unit + ' → ' + newUnit);
    if (coef !== 1) changes.push('количество ×' + coef);
    if (newWms !== wmsQty) changes.push('остаток: ' + fmt(wmsQty, 3) + ' → ' + fmt(newWms, 3));
    const newLastPrice = lastPriceInput.value === '' ? null : parseFloat(lastPriceInput.value);
    const oldLastPrice = p.last_price_per_unit || null;
    if (newLastPrice !== oldLastPrice) changes.push('актуальная цена: ' + (oldLastPrice || '—') + ' → ' + (newLastPrice || '—') + ' BYN');

    if (changes.length === 0) {
      preview.innerHTML = '<span class="muted">Нет изменений</span>';
    } else {
      preview.innerHTML =
        '<div style="color:var(--yellow);font-weight:600;margin-bottom:4px">Изменится:</div>' +
        '<ul style="margin:4px 0;padding-left:16px;font-size:11px">' +
        changes.map(c => '<li>' + esc(c) + '</li>').join('') +
        '</ul>' +
        (tiCount > 0 ? '<div class="muted">В ' + tiCount + ' позициях походов и покупках тоже обновится</div>' : '');
    }
  }

  box.querySelector('#ep-apply').addEventListener('click', async () => {
    const newName = nameInput.value.trim();
    if (!newName) { toast('Название обязательно'); return; }

    const newBrand = brandInput.value.trim() || null;
    const newUnit = unitSelect.value;
    const coef = parseFloat(coefInput.value) || 1;
    const newCat = catSelect.value === '__custom__' ? (catCustom.value.trim() || 'прочее') : catSelect.value;
    const newWms = parseFloat(wmsInput.value) || 0;

    try {
      // 1) Если меняется единица/коэффициент — через RPC
      if (newUnit !== p.unit || coef !== 1) {
        const res = await api('/rest/v1/rpc/recalc_product_unit', {
          method: 'POST',
          body: {
            p_product_id: pid, p_new_unit: newUnit,
            p_coefficient: coef, p_author: S.user?.email
          }
        });
        p.unit = newUnit;
        toast('Пересчитано: ' + res.trip_items + ' позиций');
      }

      // 2) Остальные поля — обычный PATCH
      const patch = {};
      if (newName !== p.name) patch.name = newName;
      if (newBrand !== (p.brand || null)) patch.brand = newBrand;
      if (newCat !== (p.category || 'прочее').trim().toLowerCase()) patch.category = newCat;
      const newLastPrice = lastPriceInput.value === '' ? null : parseFloat(lastPriceInput.value);
      if (newLastPrice !== (p.last_price_per_unit || null)) {
        patch.last_price_per_unit = newLastPrice;
        if (newLastPrice !== null) patch.last_price_at = new Date().toISOString();
      }

      if (Object.keys(patch).length > 0) {
        await api('/rest/v1/products?id=eq.' + pid, {
          method: 'PATCH', prefer: 'return=minimal', body: patch
        });
        Object.assign(p, patch);
      }

      // 3) Остаток на складе — через apply_wms_delta
      const delta = newWms - wmsQty;
      if (delta !== 0) {
        await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: {
            p_product_id: pid, p_delta: delta,
            p_reason: 'product_edit', p_source: 'catalog',
            p_author: S.user?.email
          }
        });
        S.wms[pid] = newWms;
      }

      await loadAll();
      closeModal();
      renderCatalog();
      toast('✅ Сохранено');
    } catch (e) {
      toast('Ошибка: ' + e.message, 5000);
    }
  });

  // УДАЛЕНИЕ
  box.querySelector('#ep-delete').addEventListener('click', async () => {
    // Проверим использование
    try {
      const [tiRes, purRes] = await Promise.all([
        api('/rest/v1/trip_items?select=id&product_id=eq.' + pid),
        api('/rest/v1/purchases?select=id&product_id=eq.' + pid),
      ]);
      const tiN = tiRes.length;
      const purN = purRes.length;

      if (tiN > 0 || purN > 0) {
        const msg = 'Нельзя удалить: продукт используется.\n\n' +
                    'В походах: ' + tiN + ' позиций\n' +
                    'В покупках: ' + purN + ' записей\n\n' +
                    'Сначала удали все походы с этим продуктом (вкладка План → 🗑) или замени продукт в походах.';
        alert(msg);
        return;
      }

      if (!confirm('Удалить продукт «' + p.name + '» навсегда?\n\nЭто необратимо. Продукт не используется ни в одном походе и ни в одной покупке.')) return;

      // Удалим WMS-строку (если есть остаток — обнулим через apply_wms_delta, потом удалим product)
      if (wmsQty > 0) {
        await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: {
            p_product_id: pid, p_delta: -wmsQty,
            p_reason: 'product_delete', p_source: 'catalog',
            p_author: S.user?.email
          }
        });
      }

      // Удалим запись из wms (FK cascade при delete product — но wms не каскадный, там PK не FK на products... проверим)
      // В нашей схеме wms.product_id REFERENCES products(id) ON DELETE CASCADE — удалится автоматом
      await api('/rest/v1/products?id=eq.' + pid, { method: 'DELETE' });

      // Обновим локальное состояние
      S.products = S.products.filter(x => x.id !== pid);
      delete S.wms[pid];

      closeModal();
      renderCatalog();
      toast('🗑 Удалено: ' + p.name);
    } catch (e) {
      toast('Ошибка: ' + e.message, 5000);
    }
  });

  updatePreview();
}

// ================= RENDER: WIZARD =================

  if (!isAdmin) {

    return;

  root.innerHTML = `

      <h2>🔧 Мастер: сгенерировать промт для ИИ</h2>
      <p class="muted" style="margin:0 0 10px">Заполни параметры → скопируй промт → отправь ИИ (ChatGPT, Qwen, DeepSeek) → получи JSON → вставь ниже → загрузи в БД.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">

        <div><label>Бюджет</label><input type="number" id="w-budget" value="1800" step="1"></div>
        <div><label>Город</label><input type="text" id="w-city" list="w-city-list" value="Брест" autocomplete="off"><datalist id="w-city-list"></datalist></div>

function extractJson(text) {
  let t = (text || '').trim();
  // 1) Если есть code-block - берём содержимое
  const m = t.match(/\`\`\`(?:json)?\s*([\s\S]*?)\`\`\`/);
  if (m) t = m[1].trim();
  // 2) Балансировка фигурных скобок: найти первую { и соответствующую ей }
  const first = t.indexOf('{');
  if (first < 0) return t;
  let depth = 0;
  let inString = false;
  let escape = false;
  for (let i = first; i < t.length; i++) {
    const ch = t[i];
    if (escape) { escape = false; continue; }
    if (ch === '\\') { escape = true; continue; }
    if (ch === '"') { inString = !inString; continue; }
    if (inString) continue;
    if (ch === '{') depth++;
    else if (ch === '}') {
      depth--;
      if (depth === 0) return t.substring(first, i + 1);
    }
  }
  return t.substring(first);
}

function validatePlan(data) {
  const trips = data.trips || data.plan || [];
  if (!Array.isArray(trips)) throw new Error('Нет поля trips[]');
  let total = 0, itemsCount = 0;
  for (const t of trips) {
    const items = t.items || [];
    itemsCount += items.length;
    for (const it of items) {
      total += +it.plan_price_total || (+it.target_qty * +it.plan_price_per_unit) || 0;
    }
  }
  return {
    trips: trips.length,
    items: itemsCount,
    total,
    first: trips[0] ? { date: trips[0].date, items: (trips[0].items || []).length } : null
  };
}

async function importPlan() {
  const data = S.wizardResult;
  if (!data) return;
  const trips = data.trips || [];
  if (!trips.length) { toast('Нет походов'); return; }

  // Найти существующие по дате (не cancelled)
  const existingByDate = {};
  for (const t of S.trips) {
    if (t.status !== 'cancelled') existingByDate[t.date] = t;
  }
  const newTrips = trips.filter(t => !existingByDate[t.date]);
  const dupTrips = trips.filter(t => existingByDate[t.date]);

  // Первый вопрос: добавлять новые?
  if (newTrips.length && !confirm('Добавить ' + newTrips.length + ' новых походов?')) return;

  // Второй вопрос: что делать с дублями?
  let updateExisting = false;
  if (dupTrips.length) {
    const dates = dupTrips.map(t => t.date).join(', ');
    const ask = 'Найдено ' + dupTrips.length + ' походов, которые уже есть в БД:\n' +
                dates + '\n\n' +
                'OK = ОБНОВИТЬ их (позиции заменятся свежими из JSON)\n' +
                'Отмена = ПРОПУСТИТЬ (оставить как есть)';
    updateExisting = confirm(ask);
  }

  let addedCount = 0;
  let updatedCount = 0;
  let skippedCount = 0;
  const errors = [];

  try {
    // 1) Обновление существующих
    if (updateExisting) {
      for (const t of dupTrips) {
        const existing = existingByDate[t.date];
        try {
          // удалить старые items
          await api('/rest/v1/trip_items?trip_id=eq.' + existing.id, {
            method: 'DELETE'
          });
          // обновить note
          await api('/rest/v1/trips?id=eq.' + existing.id, {
            method: 'PATCH',
            body: {
              kind: t.kind || 'fresh',
              note: t.note || null,
              budget_byn: t.budget_byn || null
            }
          });
          // залить новые items
          await importTripItems(existing.id, t.items || []);
          updatedCount++;
        } catch (e) {
          errors.push(t.date + ': ' + e.message);
        }
      }
    } else {
      skippedCount = dupTrips.length;
    }

    // 2) Добавление новых
    for (const t of newTrips) {
      try {
        const tripRes = await api('/rest/v1/trips', {
          method: 'POST', prefer: 'return=representation',
          body: {
            date: t.date,
            kind: t.kind || 'fresh',
            status: 'draft',
            budget_byn: t.budget_byn || null,
            note: t.note || null,
            created_by: S.user?.email
          }
        });
        const trip = tripRes[0];
        await importTripItems(trip.id, t.items || []);
        addedCount++;
      } catch (e) {
        errors.push(t.date + ': ' + e.message);
      }
    }

    await loadAll();
    renderPlan();

    let summary = '✅ ';
    if (addedCount) summary += 'Добавлено: ' + addedCount + '. ';
    if (updatedCount) summary += 'Обновлено: ' + updatedCount + '. ';
    if (skippedCount) summary += 'Пропущено: ' + skippedCount + '. ';
    if (errors.length) summary += '❌ Ошибок: ' + errors.length + '. ';

    document.getElementById('w-import').style.display = 'none';
    document.getElementById('w-in').value = '';
    document.getElementById('w-preview').innerHTML =
      '<div class="card" style="background:var(--card2);color:var(--green)">' +
      esc(summary) +
      (errors.length ? '<pre style="font-size:10px;color:var(--red);margin-top:8px">' + esc(errors.join('\n')) + '</pre>' : '') +
      '</div>';
    toast('Импорт OK: +' + addedCount + ' / ~' + updatedCount);
  } catch (e) {
    toast('Ошибка импорта: ' + e.message, 5000);
  }
}

async function importTripItems(tripId, items) {
  for (const it of items) {
    const name = (it.name || '').trim();
    if (!name) continue;
    let prod = S.products.find(p =>
      p.name.toLowerCase() === name.toLowerCase() &&
      (p.brand || '').toLowerCase() === (it.brand || '').toLowerCase()
    );
    if (!prod) {
      const pr = await api('/rest/v1/products', {
        method: 'POST', prefer: 'return=representation',
        body: {
          name, brand: it.brand || null,
          unit: it.unit || 'шт',
          category: it.category || null,
          search_url: it.search_url || null
        }
      });
      prod = pr[0];
      S.products.push(prod);
    }
    const qty = +it.target_qty || 0;
    const ppu = +it.plan_price_per_unit || 0;
    const total = +it.plan_price_total || (qty * ppu);
    await api('/rest/v1/trip_items', {
      method: 'POST', prefer: 'return=minimal',
      body: {
        trip_id: tripId, product_id: prod.id,
        target_qty: qty, unit: it.unit || prod.unit,
        plan_price_per_unit: ppu, plan_price_total: total
      }
    });
  }

// 17B-COMBINED-PROMPT: разделение ответа ИИ на два JSON -> в w-in и w-menu-in.
function _splitCombinedResponse(text) {
  const blocks = [];
  const re = /```(?:json)?\s*([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text)) !== null) blocks.push(m[1].trim());
  if (blocks.length < 2) {
    // fallback: найти два top-level JSON-объекта
    return { ok: false, error: 'Найдено блоков: ' + blocks.length + ' (нужно >=2)' };
  }
  // определение: plan содержит "trips", menu содержит "menu" или "days"
  let plan = null, menu = null;
  for (const b of blocks) {
    if (!plan && /\btrips\b/.test(b)) plan = b;
    else if (!menu && (/\bmenu\b/.test(b) || /\bdays\b/.test(b))) menu = b;
  }
  if (!plan && blocks.length >= 1) plan = blocks[0];
  if (!menu && blocks.length >= 2) menu = blocks[1];
  if (!plan || !menu) return { ok: false, error: 'не удалось определить plan/menu по содержимому' };
  return { ok: true, plan, menu };
}

// ================= VALIDATE MENU =================
function validateMenu(data) {
  const days = data.days || [];
  if (!Array.isArray(days)) throw new Error('Нет поля days[]');
  const batches = data.batch_dishes || [];
  let mealsCount = 0;
  const warnings = [];
  const productNames = new Set((S.products || []).map(p => (p.name || '').toLowerCase()));
  const tripDates = (S.trips || []).map(t => t.date).sort();
  const wmsMap = {};
  for (const [pid, have] of Object.entries(S.wms || {})) {
    const pr = productById(+pid);
    if (pr) wmsMap[(pr.name || '').toLowerCase()] = +have;
  }

  // 1) Проверка дней
  for (const day of days) {
    if (!day.date) { warnings.push('День без date'); continue; }
    if (!day.meals || !day.meals.length) warnings.push(day.date + ': нет блюд');
    mealsCount += (day.meals || []).length;
    // 2) Блюда: продукт в products?
    for (const meal of (day.meals || [])) {
      for (const ing of (meal.ingredients || [])) {
        const nm = (ing.product_name || '').toLowerCase();
        if (!nm) continue;
        if (!productNames.has(nm)) warnings.push(day.date + ' / ' + meal.name + ': продукт «' + ing.product_name + '» нет в БД продуктов');
      }
    }
  }

  // 3) Проверка доступности по датам: продукт куплен позже дня использования
  // Собираем: для каждого продукта — дата первого похода, где он появляется
  const productFirstTrip = {};
  for (const t of (S.trips || [])) {
    for (const it of (S.tripItems || [])) {
      if (it.trip_id !== t.id) continue;
      const pr = productById(it.product_id);
      if (!pr) continue;
      const key = (pr.name || '').toLowerCase();
      if (!productFirstTrip[key] || productFirstTrip[key] > t.date) productFirstTrip[key] = t.date;
    }
  }
  for (const day of days) {
    for (const meal of (day.meals || [])) {
      for (const ing of (meal.ingredients || [])) {
        const nm = (ing.product_name || '').toLowerCase();
        const firstTrip = productFirstTrip[nm];
        if (firstTrip && firstTrip >= day.date && !wmsMap[nm]) {
          warnings.push(day.date + ' / ' + meal.name + ': «' + ing.product_name + '» куплен только ' + firstTrip + ', не доступен в этот день');
        }
      }
    }
  }

  // 4) Суммарный контроль WMS: сколько продукта использовано за весь период vs сколько есть
  const usedQty = {};
  for (const day of days) {
    for (const meal of (day.meals || [])) {
      for (const ing of (meal.ingredients || [])) {
        const nm = (ing.product_name || '').toLowerCase();
        if (!nm) continue;
        const isUp = (ing.unit || '').toLowerCase() === 'уп';
        if (isUp) continue; // специи не списываются
        usedQty[nm] = (usedQty[nm] || 0) + (+ing.qty || 0) * (+meal.servings || 1);
      }
    }
  }
  for (const batch of batches) {
    for (const ing of (batch.ingredients || [])) {
      const nm = (ing.product_name || '').toLowerCase();
      if (!nm) continue;
      const isUp = (ing.unit || '').toLowerCase() === 'уп';
      if (isUp) continue;
      usedQty[nm] = (usedQty[nm] || 0) + (+ing.qty || 0) * (+batch.total_servings || 1);
    }
  }
  for (const [nm, used] of Object.entries(usedQty)) {
    const have = wmsMap[nm] || 0;
    // Учитываем походы: суммарно куплено этого продукта
    let bought = 0;
    for (const it of (S.tripItems || [])) {
      const pr = productById(it.product_id);
      if (!pr) continue;
      if ((pr.name || '').toLowerCase() === nm) bought += (+it.target_qty || 0);
    }
    const total = have + bought;
    if (total > 0 && used > total * 1.1) {
      warnings.push('Суммарно «' + nm + '» использовано ' + used.toFixed(2) + ', доступно ' + total.toFixed(2) + ' (WMS ' + have.toFixed(2) + ' + покупки ' + bought.toFixed(2) + ')');
    }
  }

  return {
    days: days.length,
    meals: mealsCount,
    batches: batches.length,
    first: days[0] ? { date: days[0].date, count: (days[0].meals || []).length } : null,
    warnings
  };
}

async function exportDataLake() {
  toast('Собираю данные...', 2000);
  try {
    const [purchases, wmsHist, products, wmsCur] = await Promise.all([
      api('/rest/v1/purchases?select=*&order=bought_at.desc&limit=5000'),
      api('/rest/v1/wms_history?select=*&order=created_at.desc&limit=2000'),
      api('/rest/v1/products?select=*&order=name'),
      api('/rest/v1/wms?select=*'),
    ]);

    const prodById = {};
    for (const p of products) prodById[p.id] = p;
    const wmsMap = {};
    for (const w of wmsCur) wmsMap[w.product_id] = +w.have_qty || 0;

    // Собираем агрегаты
    const byProduct = {};
    for (const p of purchases) {
      if (!byProduct[p.product_id]) {
        byProduct[p.product_id] = { total_qty: 0, total_sum: 0, count: 0, last_price_per_unit: null, last_bought_at: null };
      }
      const agg = byProduct[p.product_id];
      agg.total_qty += +p.qty || 0;
      agg.total_sum += +p.total_price || 0;
      agg.count++;
      if (!agg.last_bought_at || p.bought_at > agg.last_bought_at) {
        agg.last_bought_at = p.bought_at;
        agg.last_price_per_unit = p.price_per_unit;
      }
    }

    const dataLake = {
      _meta: {
        generated_at: new Date().toISOString(),
        user: S.user?.email,
        version: '1.0',
        description: 'Data lake: вся история покупок и склада. Отдай ИИ — он учтёт факты.',
      },
      _instructions_for_ai: {
        note: 'Используй purchases_history и wms_current чтобы составить новый план. Учитывай: 1) актуальные цены из products.last_price_per_unit, 2) остатки в wms_current, 3) частоту покупок в by_product.',
        format_hint: 'Сгенерируй JSON в формате: {"trips":[{"date":"YYYY-MM-DD","kind":"base|fresh","items":[{"name":"...","brand":"...","unit":"кг|л|шт|уп","target_qty":N,"plan_price_per_unit":N,"plan_price_total":N,"search_url":"...","category":"..."}]}]}',
      },
      current_plan: {
        trips_count: S.trips.length,
        trip_items_count: S.tripItems.length,
        trips: S.trips.map(t => ({
          date: t.date, kind: t.kind, status: t.status,
          items: itemsByTrip(t.id).map(it => {
            const prod = prodById[it.product_id] || {};
            return {
              product_id: it.product_id, product_name: prod.name, unit: it.unit,
              target_qty: +it.target_qty || 0,
              override_buy_qty: it.override_buy_qty,
              plan_price_per_unit: +it.plan_price_per_unit || 0,
              plan_price_total: +it.plan_price_total || 0,
              last_actual_price: prod.last_price_per_unit,
              have_at_home: wmsMap[it.product_id] || 0,
            };
          })
        }))
      },
      products_catalog: products.map(p => ({
        id: p.id, name: p.name, brand: p.brand, unit: p.unit,
        category: p.category, search_url: p.search_url,
        last_price_per_unit: p.last_price_per_unit,
        last_price_at: p.last_price_at,
      })),
      wms_current: products.filter(p => (wmsMap[p.id] || 0) > 0).map(p => ({
        product_id: p.id, name: p.name, unit: p.unit, have_qty: wmsMap[p.id],
      })),
      purchases_history: purchases.slice(0, 2000).map(p => {
        const prod = prodById[p.product_id] || {};
        return {
          bought_at: p.bought_at, product_name: prod.name, unit: p.unit,
          qty: +p.qty, price_per_unit: +p.price_per_unit || 0, total_price: +p.total_price,
          was_planned: p.was_planned, trip_id: p.trip_id, bought_by: p.bought_by,
        };
      }),
      by_product: Object.entries(byProduct).map(([pid, agg]) => {
        const prod = prodById[+pid] || {};
        return {
          product_id: +pid, name: prod.name, unit: prod.unit, category: prod.category,
          times_bought: agg.count, total_qty: +agg.total_qty.toFixed(2), total_sum: +agg.total_sum.toFixed(2),
          avg_price_per_unit: agg.total_qty > 0 ? +(agg.total_sum / agg.total_qty).toFixed(2) : null,
          last_price_per_unit: agg.last_price_per_unit ? +agg.last_price_per_unit.toFixed(2) : null,
          last_bought_at: agg.last_bought_at,
        };
      }).sort((a, b) => b.total_sum - a.total_sum),
      wms_history_recent: wmsHist.slice(0, 500).map(h => {
        const prod = prodById[h.product_id] || {};
        return {
          created_at: h.created_at, product_name: prod.name,
          delta: +h.delta_qty, qty_after: +h.qty_after, reason: h.reason,
          source: h.source, author: h.author,
        };
      }),
    };

    const fname = 'data_lake_' + new Date().toISOString().slice(0, 10) + '.json';
    download(JSON.stringify(dataLake, null, 2), fname, 'application/json');
    toast('📥 ' + fname + ' (' + Math.round(JSON.stringify(dataLake).length / 1024) + ' KB)');
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}

async function boot() {
  const ok = await refreshIfNeeded();
  if (!ok) {
    document.getElementById('tab-login').classList.add('active');
    bindLogin();
    return;
  }
  await enterApp();
}

function bindLogin() {
  const btn = document.getElementById('li-btn');
  const msg = document.getElementById('li-msg');
  const doLogin = async () => {
    const email = document.getElementById('li-email').value.trim();
    const pass = document.getElementById('li-pass').value;
    if (!email || !pass) { msg.textContent = 'Заполни email и пароль'; return; }
    btn.disabled = true; msg.textContent = 'Вход...';
    try {
      await login(email, pass);
      msg.textContent = '';
      await enterApp();
    } catch (e) {
      msg.textContent = e.message;
      btn.disabled = false;
    }
  };
  btn.addEventListener('click', doLogin);
  document.getElementById('li-pass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
}

async function enterApp() {
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-login').classList.remove('active');
  const tabsEl = document.getElementById('tabs');
  tabsEl.style.display = 'flex';

  // Берём самый свежий план (plan_start максимальный)

  const data = plan.json_data || {};
  const days = data.days || [];
  const batches = data.batch_dishes || [];

  // Карта date -> [meals]
  const byDate = {};
  for (const d of days) {
    if (d.date) byDate[d.date] = d.meals || [];
  }
  // Карта date -> [batch_info]
  const batchesByDate = {};
  for (const b of batches) {

      batchesByDate[ed].push({ id: b.id, name: b.name, cook_on: b.cook_on });

  // Навигация: начальный месяц = plan_start
  const startISO = plan.plan_start || days[0]?.date;
  if (!startISO) { root.innerHTML = '<div class="card"><div class="empty">Некорректный plan_start</div></div>'; return; }
  const startD = new Date(startISO + 'T00:00:00');
  const [year, month] = (S._menuMonth || (startISO.slice(0, 7))).split('-').map(Number);
  S._menuMonth = year + '-' + String(month).padStart(2, '0');

  const firstOfMonth = new Date(year, month - 1, 1);
  const lastOfMonth = new Date(year, month, 0);
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // 0=Mon
  const daysInMonth = lastOfMonth.getDate();

  const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const todayISO = new Date().toISOString().slice(0, 10);

  let html = '<div class="card">';
  html += '<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:12px">';
  html += '<button class="btn" id="menu-prev">←</button>';
  html += '<h2 style="margin:0">📅 ' + monthNames[month - 1] + ' ' + year + '</h2>';
  html += '<button class="btn" id="menu-next">→</button>';
  html += '</div>';
  html += '<div class="menu-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
  for (const wd of weekdays) html += '<div class="muted" style="text-align:center;font-size:11px;padding:4px">' + wd + '</div>';
  for (let i = 0; i < firstWeekday; i++) html += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const meals = byDate[iso] || [];
    const batchesHere = batchesByDate[iso] || [];
    const isToday = iso === todayISO;
    const hasContent = meals.length > 0 || batchesHere.length > 0;
    const bg = hasContent ? 'var(--card2)' : 'transparent';
    const border = isToday ? '2px solid var(--green)' : '1px solid var(--line)';
    html += '<div class="menu-day" data-date="' + iso + '" style="padding:4px;background:' + bg + ';border:' + border + ';border-radius:4px;min-height:60px;cursor:pointer">';
    html += '<div style="font-size:10px;color:var(--muted)">' + d + '</div>';
    if (hasContent) {
      html += '<div style="font-size:10px;color:var(--green);margin-top:2px">' + (meals.length + batchesHere.length) + ' блюд</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';
  root.innerHTML = html;

  document.getElementById('menu-prev').addEventListener('click', () => {
    let [y, m] = S._menuMonth.split('-').map(Number);
    m--; if (m < 1) { m = 12; y--; }
    S._menuMonth = y + '-' + String(m).padStart(2, '0');
    renderMenu();
  });
  document.getElementById('menu-next').addEventListener('click', () => {
    let [y, m] = S._menuMonth.split('-').map(Number);
    m++; if (m > 12) { m = 1; y++; }
    S._menuMonth = y + '-' + String(m).padStart(2, '0');
    renderMenu();
  });
  root.querySelectorAll('.menu-day').forEach(el => {
    el.addEventListener('click', () => openMenuDay(el.dataset.date));
  });
}

// ================= MENU: приготовлено / списание =================

// ===== 17B-MATCH-FIX: подбор продукта по «человеческому» имени из ИИ-плана =====
// ИИ пишет "Молоко 2,5%", "Сахар-песок", "Масло подсолнечное «Золотая семечка»",
// каталог — "Молоко", "Сахар", "Масло растительное". Жёсткое toLowerCase() рвётся.
function _normName(s) {
  s = String(s || '').toLowerCase();
  s = s.replace(/[«»"'"'']/g, ' ');          // кавычки-бренды -> пробел
  s = s.replace(/\d+([.,]\d+)?\s*%/g, ' ');     // жирность 2,5%
  s = s.replace(/\b(в\/с|с1|с2|со|высшего сорта|первого сорта|второго сорта)\b/g, ' ');
  s = s.replace(/[()\[\]]/g, ' ');              // скобки
  s = s.replace(/[^a-zа-яё0-9]+/gi, ' ');        // всё кроме букв/цифр -> пробел
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}
function _tokens(s) { return _normName(s).split(' ').filter(t => t.length >= 2); }
function _matchProduct(products, ingName) {
  const nm = String(ingName || '').trim();
  if (!nm) return null;
  // 1. exact (старое поведение — сохраняем как быстрый путь)
  const exact = products.find(p => (p.name || '').toLowerCase() === nm.toLowerCase());
  if (exact) return exact;
  // 2. normalised equality
  const normNm = _normName(nm);
  const normEq = products.find(p => _normName(p.name) === normNm);
  if (normEq) return normEq;
  // 3. longest-prefix по токенам: все токены плана входят в каталог или наоборот
  const tgt = _tokens(nm);
  if (!tgt.length) return null;
  let best = null, bestScore = 0;
  for (const p of products) {
    const pt = _tokens(p.name);
    if (!pt.length) continue;
    // сколько токенов совпало (в любом порядке)
    let match = 0;
    for (const t of tgt) if (pt.includes(t)) match++;
    // каталог должен содержать не меньше одного значимого токена
    if (match === 0) continue;
    // штраф за лишние токены в каталоге (молоко != молоко+сгущёнка)
    const score = match / Math.max(tgt.length, pt.length);
    if (score > bestScore) { bestScore = score; best = p; }
  }
  // порог: 50% совпадения токенов (план "Молоко 2,5%" -> каталог "Молоко" = 1/1 = 1.0)
  if (best && bestScore >= 0.5) return best;
  return null;
}


// ===== 17B-BATCH-FIX: заготовка (было "batch") ====
// meal.batch_id -> data.batch_dishes[id]. Если мы на дне cook_on — показываем
// ингредиенты и разрешаем «Приготовлено» (списание один раз, метка на все eaten_on).
function _batchById(data, bid) {
  if (!bid) return null;
  return ((data && data.batch_dishes) || []).find(b => b.id === bid) || null;
}
function _mealIngredientsWithBatch(data, meal) {
  if (meal.batch_id) {
    const b = _batchById(data, meal.batch_id);
    if (b && b.ingredients && b.ingredients.length) return b.ingredients;
  }
  return meal.ingredients || [];
}

async function markCooked(planId, dateISO, mealIdx) {
  const plan = (S.mealPlans || []).find(p => p.id === planId);
  if (!plan) { toast('План не найден'); return; }
  const data = plan.json_data || {};
  const days = data.days || [];
  const day = days.find(d => d.date === dateISO);
  if (!day) { toast('День не найден'); return; }
  const meal = (day.meals || [])[mealIdx];
  if (!meal) { toast('Блюдо не найдено'); return; }

  // Собираем списания (unit != 'уп'); для заготовки (batch_id) — ингредиенты из batch_dishes
  const ings = _mealIngredientsWithBatch(data, meal);
  const toSpend = [];
  const notFound = [];
  for (const ing of ings) {
    const isUp = (ing.unit || '').toLowerCase() === 'уп';
    if (isUp) continue;
    const prod = _matchProduct(S.products || [], ing.product_name);
    const qty = (+ing.qty || 0) * (+meal.servings || 1);
    if (qty <= 0) continue;
    if (!prod) { notFound.push({ plan_name: ing.product_name, unit: ing.unit, qty }); continue; }
    const _have = S.wms[prod.id] || 0;
    const _cap = Math.max(0, Math.min(qty, _have));   // 17B-PREVIEW-FIX: не в минус
    toSpend.push({ product_id: prod.id, name: prod.name, plan_name: ing.product_name,
                   qty, cap: _cap, unit: ing.unit, before: _have,
                   missing: _have <= 0, partial: (_cap > 0 && _cap < qty) });
  }
  if (!toSpend.length && !notFound.length) { toast('Нет продуктов для списания'); return; }
  if (!toSpend.length) { toast('Все ингредиенты отсутствуют в каталоге или на складе — списывать нечего'); }

  // 17B-PREVIEW-FIX: предпросмотр с учётом нулей и not_found
  let html = '<h3 style="margin-top:0">✓ Приготовлено: ' + esc(meal.name) + '</h3>';
  html += '<p class="muted" style="margin:0 0 10px;font-size:12px">Списать со склада (' + dateISO + ')? На складе нет = пропуск, не уходит в минус.</p>';
  html += '<table style="width:100%;font-size:12px"><thead><tr><th>Продукт</th><th class="num">Списать</th><th class="num">Остаток</th></tr></thead><tbody>';
  toSpend.forEach((sp, idx) => {
    const _def = sp.cap;
    const _after = sp.before - _def;
    const _note = sp.missing ? ' <span style="color:var(--muted);font-size:10px">(нет на складе)</span>'
                 : sp.partial ? ' <span style="color:var(--yellow);font-size:10px">(частично)</span>'
                 : '';
    html += '<tr data-sp-idx="' + idx + '"><td>' + esc(sp.name) + _note + '</td>';
    html += '<td class="num"><input type="number" step="0.001" data-sp-qty="' + idx + '" value="' + _def.toFixed(3) + '" data-sp-max="' + sp.before.toFixed(3) + '" style="width:90px;padding:3px;text-align:right"> ' + esc(sp.unit) + '</td>';
    html += '<td class="num" data-sp-after="' + idx + '" style="color:var(--muted)">' + sp.before.toFixed(3) + ' → ' + _after.toFixed(3) + '</td></tr>';
  });
  html += '</tbody></table>';
  if (notFound.length) {
    html += '<div style="margin-top:10px;padding:6px;background:rgba(255,80,80,0.1);border:1px solid var(--red);border-radius:4px;font-size:11px">';
    html += '<b>Нет в каталоге (пропущены):</b><ul style="margin:4px 0 0 0;padding-left:18px">';
    for (const nf of notFound) html += '<li>' + esc(nf.plan_name) + ' — ' + nf.qty.toFixed(3) + ' ' + esc(nf.unit || '') + '</li>';
    html += '</ul></div>';
  }
  html += '<div class="flex" style="margin-top:14px;gap:6px">';
  html += '<button class="btn green" id="cook-confirm" style="flex:1">✓ Подтвердить списание</button>';
  html += '<button class="btn" id="cook-cancel" style="flex:1">Отмена</button>';
  html += '</div>';
  modal(html);

  document.getElementById('cook-cancel').addEventListener('click', closeModal);

  // 5b: live update остатка при правке qty
  document.querySelectorAll('[data-sp-qty]').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = +inp.dataset.spQty;
      const sp = toSpend[idx];
      if (!sp) return;
      const newQty = parseFloat(inp.value);
      const maxQ = parseFloat(inp.dataset.spMax) || 0;
      const eff = isFinite(newQty) ? Math.max(0, Math.min(newQty, maxQ)) : 0;
      const afterEl = document.querySelector('[data-sp-after="' + idx + '"]');
      if (afterEl) {
        const after = sp.before - eff;
        afterEl.textContent = sp.before.toFixed(3) + ' → ' + after.toFixed(3);
        afterEl.style.color = after < 0 ? 'var(--red)' : 'var(--muted)';
      }
    });
  });

  document.getElementById('cook-confirm').addEventListener('click', async () => {
    try {
      const source = 'meal_consumption:' + planId + ':' + dateISO + ':' + mealIdx;
      let ok = 0;
      for (let i = 0; i < toSpend.length; i++) {
        const sp = toSpend[i];
        // 5c: читаем актуальное значение из input (может быть отредактировано)
        const inp = document.querySelector('[data-sp-qty="' + i + '"]');
        const raw = inp ? parseFloat(inp.value) : sp.cap;
        const maxQ = inp ? (parseFloat(inp.dataset.spMax) || 0) : sp.before;
        const qty = Math.max(0, Math.min(isFinite(raw) ? raw : 0, maxQ));   // 17B-PREVIEW-FIX: cap
        if (!isFinite(qty) || qty <= 0) continue;
        const res = await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: {
            p_product_id: sp.product_id,
            p_delta: -qty,
            p_reason: 'meal_consumption',
            p_source: source,
            p_author: S.user?.email || 'unknown'
          }
        });
        ok++;
        S.wms[sp.product_id] = (S.wms[sp.product_id] || 0) - qty;
      }
      toast('✅ Списано ' + ok + ' продуктов. Отмена: см. историю склада.');
      // Помечаем блюдо как приготовленное (в json_data)
      // 17B-BATCH-FIX: заготовку помечаем на всех eaten_on-днях (иначе на 2-3 день
      // кнопка «Приготовлено» снова появится и пользователь спишет второй раз).
      const _nowIso = new Date().toISOString();
      if (meal.batch_id) {
        const b = _batchById(data, meal.batch_id);
        const eaten = (b && b.eaten_on) || [dateISO];
        for (const d2 of (data.days || [])) {
          if (!eaten.includes(d2.date)) continue;
          for (const m2 of (d2.meals || [])) {
            if (m2.batch_id === meal.batch_id) {
              m2._cooked = true;
              m2._cooked_at = _nowIso;
              m2._cooked_on = dateISO;   // реальный день готовки
            }
          }
        }
      } else {
        meal._cooked = true;
        meal._cooked_at = _nowIso;
      }
      await api('/rest/v1/meal_plans?id=eq.' + planId, {
        method: 'PATCH',
        body: { json_data: data }
      });
      await loadAll();
      closeModal();
    } catch (e) {
      toast('Ошибка списания: ' + e.message, 5000);
    }
  });
}


// ================= MENU: отмена приготовления =================
async function unconsumedMeal(planId, dateISO, mealIdx) {
  const plan = (S.mealPlans || []).find(p => p.id === planId);
  if (!plan) { toast('План не найден'); return; }
  const data = plan.json_data || {};
  const days = data.days || [];
  const day = days.find(d => d.date === dateISO);
  if (!day) { toast('День не найден'); return; }
  const meal = (day.meals || [])[mealIdx];
  if (!meal) { toast('Блюдо не найдено'); return; }

  // 17B-UNCOOK-BATCH: для заготовки списание шло под днём готовки (cook_on),
  // а «Отменить» можно нажать и со 2-3 дня (meal._cooked_on != dateISO).
  let _srcDate = dateISO;
  let _srcIdx = mealIdx;
  if (meal.batch_id) {
    const _b = _batchById(data, meal.batch_id);
    _srcDate = meal._cooked_on || (_b && _b.cook_on) || dateISO;
    // найти meal-индекс в том дне, где был клик готовки
    const _cookDay = (data.days || []).find(d => d.date === _srcDate);
    if (_cookDay) {
      const _mi = (_cookDay.meals || []).findIndex(m => m.batch_id === meal.batch_id);
      if (_mi >= 0) _srcIdx = _mi;
    }
  }
  const sourcePrefix = 'meal_consumption:' + planId + ':' + _srcDate + ':' + _srcIdx;
  if (!confirm('Отменить списание за «' + meal.name + '»? Продукты вернутся на склад.')) return;

  try {
    // 1) Найти все записи списания для этого блюда
    const r = await api('/rest/v1/wms_history?select=id,product_id,delta_qty,source&source=like.' + encodeURIComponent(sourcePrefix + '%') + '&reason=eq.meal_consumption');
    if (!r || !r.length) { toast('Нет записей списания для отмены'); return; }
    // 2) Вернуть каждый продукт (delta_qty был отрицательный — вернём плюс)
    let ok = 0;
    for (const rec of r) {
      try {
        await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: {
            p_product_id: rec.product_id,
            p_delta: -(+rec.delta_qty),   // отрицательный -> положительный
            p_reason: 'meal_unconsumption',
            p_source: 'revert:' + rec.source + ':' + rec.id,
            p_author: S.user?.email || 'unknown'
          }
        });
        S.wms[rec.product_id] = (S.wms[rec.product_id] || 0) - (+rec.delta_qty);
        ok++;
      } catch (e) {
        console.warn('revert fail', rec.id, e);
      }
    }
    // 3) Снять _cooked в json_data (для заготовки — со всех дней)
    if (meal.batch_id) {
      for (const d2 of (data.days || [])) {
        for (const m2 of (d2.meals || [])) {
          if (m2.batch_id === meal.batch_id) {
            delete m2._cooked;
            delete m2._cooked_at;
            delete m2._cooked_on;
          }
        }
      }
    } else {
      delete meal._cooked;
      delete meal._cooked_at;
      delete meal._cooked_on;
    }
    await api('/rest/v1/meal_plans?id=eq.' + planId, {
      method: 'PATCH',
      body: { json_data: data }
    });
    toast('↩ Возвращено ' + ok + ' продуктов на склад');
    await loadAll();
    closeModal();
  } catch (e) {
    toast('Ошибка отмены: ' + e.message, 5000);
  }
}
