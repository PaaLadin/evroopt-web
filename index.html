<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1419">
<title>Evroopt Budget</title>
<style>
:root{
  --bg:#0f1419; --card:#171d24; --card2:#1c232b; --line:#2a323c;
  --text:#e6edf3; --muted:#8b949e;
  --green:#3fb950; --yellow:#d29922; --red:#f85149; --blue:#58a6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;min-height:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.hh{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600}
.hh .who{font-size:11px;color:var(--muted)}
.hh .who b{color:var(--blue)}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;background:transparent;border:0;color:var(--muted);padding:11px 12px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);background:rgba(88,166,255,.05)}
main{padding:12px 10px 80px;max-width:1400px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--yellow);display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{background:#232a33}
.btn.primary{background:var(--blue);color:#001a33;border-color:var(--blue);font-weight:600}
.btn.green{background:var(--green);color:#002200;border-color:var(--green);font-weight:600}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{background:#0a0e12;border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:5px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.3px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:12px}
th{background:#141a20;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
tr:hover td{background:#1a2129}
.row-done td{opacity:.55}
.row-done a{text-decoration:line-through}
.pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pill.draft{background:#333a44;color:var(--muted)}
.pill.approved{background:rgba(88,166,255,.15);color:var(--blue)}
.pill.in_progress{background:rgba(210,153,34,.15);color:var(--yellow)}
.pill.done{background:rgba(63,185,80,.15);color:var(--green)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--muted);font-size:11px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.trip-card{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;transition:.15s}
.trip-card:hover{border-color:var(--blue)}
.trip-card.sel{border-color:var(--blue);background:rgba(88,166,255,.08)}
.tc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tc-date{font-weight:600}
.tc-items{font-size:11px;color:var(--muted)}
.tc-sum{font-weight:600;margin-top:4px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:960px;width:96%;max-height:92vh;overflow:auto}
#modal h3{margin:0 0 12px;font-size:14px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
#toast.on{opacity:.95}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){
  main{padding:8px 6px 80px}
  th,td{padding:5px 4px;font-size:11px}
  .btn{padding:6px 9px;font-size:11px}
  .grid{grid-template-columns:1fr}
  .hide-sm{display:none}
}
</style>
<style id="fact-card-css">
@media (max-width: 720px) {
  .fact-row {
    display: grid !important;
    grid-template-columns: 28px 1fr;
    gap: 6px;
    padding: 10px 8px !important;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 8px;
    background: var(--card2);
  }
  .fact-row.done { opacity: 0.5; }
  .fact-row .f-check { grid-row: 1; grid-column: 1; align-self: start; margin-top: 4px; }
  .fact-row .f-name { grid-row: 1; grid-column: 2; font-weight: 600; }
  .fact-row .f-name a { font-size: 13px; }
  .fact-row .f-meta { grid-row: 2; grid-column: 2; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .fact-row .f-inputs {
    grid-row: 3; grid-column: 2;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;
  }
  .fact-row .f-inputs label { font-size: 10px; color: var(--muted); display: block; margin: 0 0 2px; }
  .fact-row .f-inputs input {
    width: 100% !important; padding: 8px 6px !important; font-size: 14px !important;
    text-align: center; min-height: 40px;
  }
  /* Прячем старую таблицу на мобиле */
  .fact-table-desktop { display: none !important; }
  /* Кнопка сохранить */
  .modal-save-btn {
    position: sticky; bottom: 0; width: 100%; margin-top: 12px;
    padding: 14px !important; font-size: 15px !important;
  }
}
@media (min-width: 721px) {
  .fact-cards-mobile { display: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="hh">
    <h1>🛒 Evroopt Budget</h1>
    <div class="who" id="who">не авторизован</div>
  </div>
  <div class="tabs" id="tabs" style="display:none">
    <button data-tab="plan" class="active">📋 План</button>
    <button data-tab="wms">📦 Склад</button>

<main>
  <section id="tab-login" class="tab-content active">
    <div class="card" style="max-width:380px;margin:40px auto">
      <h2>Вход</h2>
      <label>Email</label>
      <input type="email" id="li-email" placeholder="paaladin@paaladin.ru" autocomplete="username">
      <label>Пароль</label>
      <input type="password" id="li-pass" autocomplete="current-password">
      <div style="margin-top:14px"><button class="btn primary" id="li-btn" style="width:100%">Войти</button></div>

  </section>
  <section id="tab-plan" class="tab-content"></section>
  <section id="tab-wms" class="tab-content"></section>

  <section id="tab-sync" class="tab-content"></section>
</main>
<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast"></div>
<script>
// ================= CONFIG =================
const CFG = {
  url: 'https://mowkvfgxrvfcafuuiaho.supabase.co',
  key: 'sb_publishable_n9b-TOXOCU_ojtb0a_kbyQ_g3odyXIX'
};
const LS = 'evroopt_session_v1';
const LS_CACHE = 'evroopt_cache_v1';

// ================= STATE =================
const S = {
  token: null,
  user: null,
  role: null,
  products: [],
  trips: [],
  tripItems: [],
  wms: {},
  currentTripId: null,
  wizardResult: null,
};

// ================= API =================
async function api(path, opts = {}) {
  const headers = {
    'apikey': CFG.key,
    'Content-Type': 'application/json',
    ...(opts.headers || {})
  };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  if (opts.prefer) headers['Prefer'] = opts.prefer;
  const res = await fetch(CFG.url + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(res.status + ' ' + err.slice(0, 300));
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

// ================= AUTH =================
async function login(email, password) {
  const res = await fetch(CFG.url + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': CFG.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  if (!res.ok) throw new Error('Неверный email или пароль');
  const d = await res.json();
  S.token = d.access_token;
  S.user = d.user;
  S.role = (d.user.app_metadata || {}).role || 'buyer';
  localStorage.setItem(LS, JSON.stringify({
    token: d.access_token,
    refresh: d.refresh_token,
    email: d.user.email,
    role: S.role,
    exp: Date.now() + (d.expires_in * 1000) - 60000
  }));
  return d;
}

async function refreshIfNeeded() {
  const raw = localStorage.getItem(LS);
  if (!raw) return false;
  const s = JSON.parse(raw);
  if (!s.token) return false;
  if (s.exp && s.exp > Date.now()) {
    S.token = s.token;
    S.role = s.role;
    S.user = { email: s.email, app_metadata: { role: s.role } };
    return true;
  }
  // нужно обновить
  try {
    const res = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': CFG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh })
    });
    if (!res.ok) throw new Error('refresh failed');
    const d = await res.json();
    S.token = d.access_token;
    S.user = d.user;
    S.role = (d.user.app_metadata || {}).role || 'buyer';
    localStorage.setItem(LS, JSON.stringify({
      token: d.access_token, refresh: d.refresh_token,
      email: d.user.email, role: S.role,
      exp: Date.now() + (d.expires_in * 1000) - 60000
    }));
    return true;
  } catch (e) {
    localStorage.removeItem(LS);
    return false;
  }
}

function logout() {
  S.token = null; S.user = null; S.role = null;
  localStorage.removeItem(LS);
  location.reload();
}

// ================= TOAST / MODAL =================
function toast(msg, ms = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), ms);
}

function modal(html) {
  const m = document.getElementById('modal');
  document.getElementById('modal-box').innerHTML = html;
  m.classList.add('on');
}
function closeModal() {
  document.getElementById('modal').classList.remove('on');
}
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// ================= HELPERS =================
function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (+n).toFixed(d);
}
function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}
// ================= DATA LOAD =================
async function loadAll() {
  const [products, trips, items, wms] = await Promise.all([
    api('/rest/v1/products?select=*&order=name'),
    api('/rest/v1/trips?select=*&order=date.asc'),
    api('/rest/v1/trip_items?select=*'),
    api('/rest/v1/wms?select=*'),
  ]);
  S.products = products || [];
  S.trips = trips || [];
  S.tripItems = items || [];
  S.wms = {};
  for (const w of (wms || [])) S.wms[w.product_id] = +w.have_qty || 0;
}

function productById(id) { return S.products.find(p => p.id === id); }
function tripById(id) { return S.trips.find(t => t.id === id); }
function itemsByTrip(tid) { return S.tripItems.filter(i => i.trip_id === tid); }

function calcTrip(trip) {
  const items = itemsByTrip(trip.id);
  let plan = 0, fact = 0, bought = 0;
  for (const it of items) {
    plan += +it.plan_price_total || 0;
    bought += it._bought ? 1 : 0;
    fact += it._fact_price || 0;
  }
  return { items, plan, fact, bought, total: items.length };
}

// ================= RENDER: PLAN =================
function renderPlan() {
  const root = document.getElementById('tab-plan');
  const isAdmin = S.role === 'admin';

  // группируем по статусу
  const groups = { draft: [], approved: [], in_progress: [], done: [] };
  for (const t of S.trips) {
    const st = t.status || 'draft';
    if (groups[st]) groups[st].push(t);
  }

  let html = '<div class="card"><h2>📋 Походы <span class="muted" style="font-weight:400">' + S.trips.length + '</span></h2>';
  if (isAdmin) {
    html += '<div class="flex" style="margin-bottom:10px;flex-wrap:wrap">';
    html += '<button class="btn primary" id="add-trip-btn">+ Добавить поход</button>';
    html += '<button class="btn" id="reload-btn">🔄 Обновить</button>';
    html += '<button class="btn red" id="clear-trips-btn">🗑 Очистить походы</button>';
    html += '<button class="btn" id="clear-products-btn" title="Удалить продукты, которые не используются ни в одном походе">🧹 Неисп. продукты</button>';
    html += '</div>';
  }

  const statusNames = { draft: 'Черновик', approved: 'Утверждён', in_progress: 'В процессе', done: 'Завершён' };
  for (const st of ['draft', 'approved', 'in_progress', 'done']) {
    if (!groups[st].length) continue;
    if (st === 'draft' && !isAdmin) continue;
    html += '<h3 style="font-size:12px;margin:14px 0 6px;color:var(--muted)">' + statusNames[st] + ' (' + groups[st].length + ')</h3>';
    html += '<div class="grid">';
    for (const t of groups[st]) {
      const c = calcTrip(t);
      html += '<div class="trip-card" data-trip="' + t.id + '">';
      html += '<div class="tc-h"><span class="tc-date">' + fmtDate(t.date) + '</span><span class="pill ' + st + '">' + statusNames[st] + '</span></div>';
      html += '<div class="tc-items">' + c.items.length + ' поз · план ' + fmt(c.plan) + ' BYN</div>';
      if (t.note) html += '<div class="tc-items" style="color:var(--muted);font-style:italic">' + esc(t.note) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  if (!S.trips.length) html += '<div class="empty">Походов нет. Открой вкладку «Мастер» чтобы создать план.</div>';
  html += '</div>';
  root.innerHTML = html;

  root.querySelectorAll('.trip-card').forEach(el => {
    el.addEventListener('click', () => openTrip(+el.dataset.trip));
  });
  const addBtn = document.getElementById('add-trip-btn');
  if (addBtn) addBtn.addEventListener('click', addTripModal);
  const reloadBtn = document.getElementById('reload-btn');
  if (reloadBtn) reloadBtn.addEventListener('click', async () => {
    await loadAll(); renderPlan(); toast('Обновлено');
  });
  const clearBtn = document.getElementById('clear-trips-btn');
  if (clearBtn) clearBtn.addEventListener('click', clearAllTrips);
  const clearProdBtn = document.getElementById('clear-products-btn');
  if (clearProdBtn) clearProdBtn.addEventListener('click', clearUnusedProducts);
}

// ================= TRIP DETAIL =================
async function openTrip(tid) {
  const t = tripById(tid);
  if (!t) return;
  const items = itemsByTrip(tid);
  const isAdmin = S.role === 'admin';
  const isBuyer = S.role === 'buyer';
  const isDraft = t.status === 'draft';
  const editable = isAdmin && isDraft;
  const canBuy = (isAdmin || isBuyer) && (t.status === 'approved' || t.status === 'in_progress');
  const canFinish = isAdmin && (t.status === 'approved' || t.status === 'in_progress');

  const statusNames = { draft: 'Черновик', approved: 'Утверждён', in_progress: 'В процессе', done: 'Завершён' };
  let html = '<h3 style="margin-top:0">Поход ' + fmtDate(t.date) + ' — ' + statusNames[t.status] + '</h3>';
  if (t.note) html += '<p class="muted" style="font-size:11px">' + esc(t.note) + '</p>';

  // Кнопки действий (только для admin)
  if (isAdmin && isDraft) {
    html += '<div class="flex" style="margin:10px 0;flex-wrap:wrap">';
    html += '<button class="btn green" data-act="approve" data-tid="' + tid + '">✅ Утвердить</button>';
    html += '<button class="btn red" data-act="cancel" data-tid="' + tid + '">✖ Отменить</button>';
    html += '<button class="btn" data-act="additem" data-tid="' + tid + '">+ Позиция</button>';
    html += '</div>';
  }

  // Таблица на десктопе, карточки на мобиле — оба варианта, CSS переключает
  let totalPlan = 0, includedCount = 0, boughtCount = 0;

  // Считаем итоги
  for (const it of items) {
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buy = (ov !== null && ov !== undefined) ? +ov : Math.max(0, (+it.target_qty || 0) - have);
    if (!it.hidden) {
      totalPlan += buy * (+it.plan_price_per_unit || 0);
      includedCount++;
      if (it._bought) boughtCount++;
    }
  }

  // ============ DESKTOP: таблица ============
  html += '<div class="fact-table-desktop" style="overflow-x:auto"><table style="min-width:680px">';
  html += '<thead><tr>';
  if (editable) html += '<th style="width:32px">Вкл</th>';
  html += '<th>Товар</th><th class="hide-sm">Вес</th><th class="num" style="width:90px">Купить</th><th class="num hide-sm">Дома</th><th class="num">План</th><th class="num">Факт ₽</th><th class="num hide-sm">Факт вес</th>';
  html += '</tr></thead><tbody>';

  for (const it of items) {
    const p = productById(it.product_id) || { name: '?', unit: it.unit, search_url: '' };
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buyCalc = Math.max(0, (+it.target_qty || 0) - have);
    const buy = (ov !== null && ov !== undefined) ? +ov : buyCalc;
    const isOverride = (ov !== null && ov !== undefined);
    const planAdj = buy * (+it.plan_price_per_unit || 0);
    const done = it._bought ? 'row-done' : '';
    const hiddenRow = it.hidden ? ' style="opacity:0.35;background:#1a1d21"' : '';

    html += '<tr class="' + done + '" data-iid="' + it.id + '"' + hiddenRow + '>';
    if (editable) {
      html += '<td style="text-align:center"><input type="checkbox" data-act="visible" ' + (it.hidden ? '' : 'checked') + '></td>';
    }
    html += '<td><a href="' + esc(p.search_url || '#') + '" target="_blank">' + esc(p.name) + '</a>';
    if (p.brand) html += '<div class="muted">' + esc(p.brand) + '</div></td>';
    html += '<td class="hide-sm">' + fmt(+it.target_qty, 2) + ' ' + esc(it.unit || p.unit || '') + '</td>';
    html += '<td class="num">';
    if (editable) {
      html += '<input type="number" step="0.01" style="width:80px;padding:3px 5px;text-align:right" data-act="buy-qty" value="' + fmt(buy, 2) + '">';
    } else {
      html += '<b>' + fmt(buy, 2) + '</b>' + (isOverride ? ' ✎' : '');
    }
    html += '</td>';
    html += '<td class="num hide-sm">' + fmt(have, 2) + '</td>';
    html += '<td class="num">' + fmt(planAdj, 2) + '</td>';
    html += '<td class="num">' + (canBuy ? '<input type="number" step="0.01" style="width:70px;padding:3px 5px;text-align:right" data-act="fact-price" value="' + (it._fact_price || '') + '">' : fmt(it._fact_price, 2)) + '</td>';
    html += '<td class="num hide-sm">' + (canBuy ? '<input type="text" style="width:60px;padding:3px 5px" data-act="fact-weight" value="' + esc(it._fact_weight || '') + '" placeholder="' + fmt(buy, 2) + '">' : esc(it._fact_weight || '—')) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  // ============ MOBILE: карточки ============
  html += '<div class="fact-cards-mobile">';
  for (const it of items) {
    const p = productById(it.product_id) || { name: '?', unit: it.unit, search_url: '' };
    const have = S.wms[it.product_id] || 0;
    const ov = it.override_buy_qty;
    const buy = (ov !== null && ov !== undefined) ? +ov : Math.max(0, (+it.target_qty || 0) - have);
    const planAdj = buy * (+it.plan_price_per_unit || 0);
    const done = it._bought ? ' done' : '';

    html += '<div class="fact-row' + done + '" data-iid="' + it.id + '">';
    html += '<div class="f-check">';
    if (canBuy || editable) {
      html += '<input type="checkbox" data-act="bought" ' + (it._bought ? 'checked' : '') + ' style="width:22px;height:22px">';
    } else if (it._bought) {
      html += '✓';
    }
    html += '</div>';
    html += '<div class="f-name"><a href="' + esc(p.search_url || '#') + '" target="_blank">' + esc(p.name) + '</a></div>';
    html += '<div class="f-meta">';
    html += 'План: ' + fmt(buy, 2) + ' ' + esc(it.unit || p.unit || '') + ' · ' + fmt(planAdj, 2) + ' BYN';
    html += '</div>';
    if (canBuy || editable) {
      html += '<div class="f-inputs">';
      html += '<div><label>Факт цена (BYN)</label><input type="number" step="0.01" data-act="fact-price" value="' + (it._fact_price || '') + '" placeholder="' + fmt(planAdj, 2) + '"></div>';
      html += '<div><label>Факт вес (' + esc(it.unit || p.unit || '') + ')</label><input type="text" data-act="fact-weight" value="' + esc(it._fact_weight || '') + '" placeholder="' + fmt(buy, 2) + '"></div>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  // Итоги + кнопки
  html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">';
  html += '<div class="muted" style="margin-bottom:10px">Включено: <b>' + includedCount + '</b> из ' + items.length;
  if (canBuy) html += ' · куплено: <b>' + boughtCount + '</b>';
  html += ' · план: <b>' + fmt(totalPlan) + ' BYN</b></div>';

  // Кнопка СОХРАНИТЬ (для buyer и для admin в approved)
  if (canBuy) {
    html += '<button class="btn green modal-save-btn" data-act="save-draft" id="btn-save-draft">💾 Сохранить</button>';
  }

  // Кнопка ПЕРЕНЕСТИ НА СКЛАД (только admin, когда поход approved/in_progress)
  if (canFinish) {
    html += '<button class="btn green modal-save-btn" style="margin-top:8px;background:#2d7a3e" data-act="transfer" id="btn-transfer">📦 Перенести на склад</button>';
    html += '<button class="btn red" style="margin-top:6px;width:100%" data-act="cancel" data-tid="' + tid + '">✖ Отменить поход</button>';
  }

  html += '<button class="btn" style="margin-top:8px;width:100%" onclick="closeModal()">Закрыть</button>';
  html += '</div>';

  modal(html);
  bindTripModal(tid);
}

function bindTripModal(tid) {
  const box = document.getElementById('modal-box');

  // Кнопки действий
  box.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;
    if (['bought', 'fact-price', 'fact-weight', 'visible', 'buy-qty'].includes(act)) return;
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      if (act === 'approve') await tripApprove(tid);
      if (act === 'finish') await tripFinish(tid);
      if (act === 'cancel') await tripCancel(tid);
      if (act === 'additem') return addItemModal(tid);

    // Кнопка "Сохранить" — сохраняет локальный черновик и закрывает
    if (act === 'save-draft') {
      saveFactDraft();
      toast('💾 Сохранено локально');
      return;
    }

    // Кнопка "Перенести на склад" — вызывает tripFinish
    if (act === 'transfer') {
      await tripFinish(tid);
      return;
    }

      if (act === 'show-all') {
        // Показать скрытые в текущем модале
        box.querySelectorAll('tr[data-iid]').forEach(tr => {
          const it = S.tripItems.find(x => x.id === +tr.dataset.iid);
          if (it && it.hidden) {
            tr.style.opacity = '0.6';
            tr.style.background = '#1a1d21';
          }
        });
        toast('Скрытые позиции показаны');
        return;
      }
    });
  });

  // Поля ввода
  box.querySelectorAll('input[data-act]').forEach(inp => {
    const act = inp.dataset.act;

    // Чекбокс «видимость» — сохранение в БД сразу
    if (act === 'visible') {
      inp.addEventListener('change', async () => {
        const tr = inp.closest('tr');
        const iid = +tr.dataset.iid;
        const it = S.tripItems.find(x => x.id === iid);
        if (!it) return;
        const newHidden = !inp.checked;
        try {
          await api('/rest/v1/trip_items?id=eq.' + iid, {
            method: 'PATCH',
            body: { hidden: newHidden }
          });
          it.hidden = newHidden;
          tr.style.opacity = newHidden ? '0.35' : '1';
          tr.style.background = newHidden ? '#1a1d21' : '';
          toast(newHidden ? 'Скрыто от сына' : 'Показано сыну');
        } catch (e) {
          inp.checked = !inp.checked;
          toast('Ошибка: ' + e.message, 4000);
        }
      });
      return;
    }

    // Редактирование «Купить»
    if (act === 'buy-qty') {
      inp.addEventListener('change', async () => {
        const tr = inp.closest('tr');
        const iid = +tr.dataset.iid;
        const it = S.tripItems.find(x => x.id === iid);
        if (!it) return;
        const val = inp.value.trim();
        const newVal = val === '' ? null : parseFloat(val);
        try {
          await api('/rest/v1/trip_items?id=eq.' + iid, {
            method: 'PATCH',
            body: { override_buy_qty: newVal }
          });
          it.override_buy_qty = newVal;
          // Пересчитать план в строке
          const pricePerUnit = +it.plan_price_per_unit || 0;
          const newPlan = (newVal !== null ? newVal : Math.max(0, (+it.target_qty || 0) - (S.wms[it.product_id] || 0))) * pricePerUnit;
          const planCell = tr.children[tr.children.length - 3];
          if (planCell) planCell.textContent = fmt(newPlan, 2);
          toast('Купить: ' + fmt(newVal !== null ? newVal : Math.max(0, (+it.target_qty || 0) - (S.wms[it.product_id] || 0)), 2) + ' · План: ' + fmt(newPlan, 2) + ' BYN');
        } catch (e) {
          toast('Ошибка: ' + e.message, 4000);
        }
      });
      return;
    }

    // Существующие: bought / fact-price / fact-weight (локальный черновик)
    inp.addEventListener('change', () => {
      const tr = inp.closest('tr');
      const iid = +tr.dataset.iid;
      const it = S.tripItems.find(x => x.id === iid);
      if (!it) return;
      if (act === 'bought') {
        it._bought = inp.checked;
        tr.classList.toggle('row-done', inp.checked);
      }
      if (act === 'fact-price') it._fact_price = +inp.value || 0;
      if (act === 'fact-weight') it._fact_weight = inp.value;
      saveFactDraft();
    });
  });
}

function saveFactDraft() {
  const draft = {};
  for (const it of S.tripItems) {
    if (it._bought !== undefined || it._fact_price !== undefined) {
      draft[it.id] = {
        bought: it._bought,
        fact_price: it._fact_price,
        fact_weight: it._fact_weight
      };
    }
  }
  localStorage.setItem(LS_CACHE, JSON.stringify(draft));
}

function loadFactDraft() {
  try {
    const raw = localStorage.getItem(LS_CACHE);
    if (!raw) return;
    const draft = JSON.parse(raw);
    for (const it of S.tripItems) {
      const d = draft[it.id];
      if (d) {
        it._bought = d.bought;
        it._fact_price = d.fact_price;
        it._fact_weight = d.fact_weight;
      }
    }
  } catch (e) {}
}

// Добавляем кнопку "Очистить все походы" в renderPlan (только admin)
// Патч: добавляем в конец renderPlan после addBtn

// (функция clearAllTrips вызывается по кнопке)
async function clearAllTrips() {
  if (S.role !== 'admin') { toast('Только для админа'); return; }
  const count = S.trips.length;
  if (count === 0) { toast('Нет походов'); return; }

  const msg = 'Удалить ВСЕ ' + count + ' походов и их позиции?\n\n' +
              'Продукты (справочник) останутся.\n' +
              'Покупки (purchases) и склад (wms) НЕ затрагиваются.\n\n' +
              'Это необратимо. Продолжить?';
  if (!confirm(msg)) return;
  if (!confirm('Точно? Все ' + count + ' походов будут удалены.')) return;

  try {
    // Удаляем все trips (cascade удалит trip_items)
    await api('/rest/v1/trips?id=gt.0', { method: 'DELETE' });
    S.trips = [];
    S.tripItems = [];
    renderPlan();
    toast('🗑 Удалено ' + count + ' походов');
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}

async function clearUnusedProducts() {
  if (S.role !== 'admin') { toast('Только для админа'); return; }
  // Находим products, которые не используются ни в одном trip_item и не в purchases
  try {
    const usedInTrips = await api('/rest/v1/trip_items?select=product_id');
    const usedInPurchases = await api('/rest/v1/purchases?select=product_id');
    const usedIds = new Set([
      ...usedInTrips.map(x => x.product_id),
      ...usedInPurchases.map(x => x.product_id)
    ]);
    const unused = S.products.filter(p => !usedIds.has(p.id));
    if (!unused.length) { toast('Неиспользуемых продуктов нет'); return; }
    const msg = 'Найдено ' + unused.length + ' неиспользуемых продуктов.\n\n' +
                unused.slice(0, 10).map(p => '· ' + p.name).join('\n') +
                (unused.length > 10 ? '\n…и ещё ' + (unused.length - 10) : '') +
                '\n\nУдалить их из справочника?';
    if (!confirm(msg)) return;
    for (const p of unused) {
      await api('/rest/v1/products?id=eq.' + p.id, { method: 'DELETE' });
    }
    S.products = S.products.filter(p => !unused.includes(p));
    toast('🗑 Удалено ' + unused.length + ' продуктов');
  } catch (e) {
    toast('Ошибка: ' + e.message, 5000);
  }
}
// ================= TRIP ACTIONS =================
async function tripApprove(tid) {
  if (!confirm('Утвердить поход? Сын сможет видеть его на телефоне.')) return;
  try {
    await api('/rest/v1/trips?id=eq.' + tid, {
      method: 'PATCH',
      body: { status: 'approved', approved_at: new Date().toISOString(), approved_by: S.user?.email }
    });
    const t = tripById(tid); if (t) t.status = 'approved';
    closeModal(); renderPlan();
    toast('Поход утверждён');
  } catch (e) { toast('Ошибка: ' + e.message, 4000); }
}

async function tripCancel(tid) {
  if (!confirm('Отменить поход?')) return;
  try {
    await api('/rest/v1/trips?id=eq.' + tid, {
      method: 'PATCH', body: { status: 'draft', approved_at: null, approved_by: null }
    });
    const t = tripById(tid); if (t) { t.status = 'draft'; t.approved_at = null; t.approved_by = null; }
    closeModal(); renderPlan(); toast('Отменён');
  } catch (e) { toast('Ошибка: ' + e.message, 4000); }
}

async function tripFinish(tid) {
  if (!confirm('Завершить поход? Все отмеченные позиции попадут в purchases и склад.')) return;
  const items = itemsByTrip(tid).filter(it => it._bought && it._fact_price > 0);
  if (!items.length) { toast('Нет купленных позиций с ценой'); return; }
  try {
    for (const it of items) {
      const qty = (+it._fact_weight || Math.max(0, (+it.target_qty || 0) - (S.wms[it.product_id] || 0)));
      const total = +it._fact_price || 0;
      const ppu = qty > 0 ? total / qty : 0;

      // 1) purchases (append)
      await api('/rest/v1/purchases', {
        method: 'POST',
        prefer: 'return=minimal',
        body: {
          trip_id: tid, trip_item_id: it.id, product_id: it.product_id,
          qty: qty, unit: it.unit,
          price_per_unit: ppu, total_price: total,
          was_planned: true, bought_by: S.user?.email
        }
      });

      // 2) WMS add (через RPC — с историей)
      await api('/rest/v1/rpc/apply_wms_delta', {
        method: 'POST',
        body: {
          p_product_id: it.product_id,
          p_delta: qty,
          p_reason: 'purchase',
          p_source: 'trip#' + tid,
          p_author: S.user?.email || 'admin'
        }
      });

      S.wms[it.product_id] = (S.wms[it.product_id] || 0) + qty;
    }

    // 3) trip -> done
    await api('/rest/v1/trips?id=eq.' + tid, {
      method: 'PATCH',
      body: { status: 'done', done_at: new Date().toISOString(), done_by: S.user?.email }
    });
    const t = tripById(tid); if (t) t.status = 'done';

    // 4) очистить локальный черновик по этим позициям
    for (const it of items) { delete it._bought; delete it._fact_price; delete it._fact_weight; }
    saveFactDraft();

    closeModal(); renderPlan();
    toast('Поход закрыт, ' + items.length + ' позиций в purchases');
  } catch (e) { toast('Ошибка: ' + e.message, 5000); }
}

// ================= RENDER: WMS =================
function renderWMS() {
  const root = document.getElementById('tab-wms');
  const isAdmin = S.role === 'admin';
  const rows = S.products.map(p => {
    const have = S.wms[p.id] || 0;
    return { p, have };
  }).filter(r => r.have > 0 || isAdmin).sort((a, b) => a.p.name.localeCompare(b.p.name));

  let html = '<div class="card"><h2>📦 Склад дома <span class="muted" style="font-weight:400">' + Object.values(S.wms).filter(x => x > 0).length + ' позиций</span></h2>';
  html += '<p class="muted" style="margin:0 0 10px">Обнови остатки перед походом. Все изменения пишутся в историю.</p>';
  if (isAdmin) {
    html += '<div class="flex" style="margin-bottom:10px"><button class="btn primary" id="wms-add">+ Добавить продукт</button>';
    html += '<button class="btn" id="wms-reload">🔄 Обновить</button></div>';
  }

  if (!rows.length) {
    html += '<div class="empty">Склад пуст</div>';
  } else {
    html += '<table><thead><tr><th>Продукт</th><th class="num">Кол-во</th><th>Ед.</th>' + (isAdmin ? '<th></th>' : '') + '</tr></thead><tbody>';
    for (const r of rows) {
      html += '<tr data-pid="' + r.p.id + '">';
      html += '<td>' + esc(r.p.name) + (r.p.brand ? '<div class="muted">' + esc(r.p.brand) + '</div>' : '') + '</td>';
      html += '<td class="num">' + (isAdmin ? '<input type="number" step="0.001" value="' + r.have + '" data-pid="' + r.p.id + '" style="width:90px;text-align:right;padding:3px 5px">' : fmt(r.have, 3)) + '</td>';
      html += '<td>' + esc(r.p.unit || '') + '</td>';
      if (isAdmin) html += '<td><button class="btn sm" data-wms-zero="' + r.p.id + '">0</button></td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
  }
  html += '</div>';
  root.innerHTML = html;

  root.querySelectorAll('input[data-pid]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const pid = +inp.dataset.pid;
      const newVal = +inp.value || 0;
      const oldVal = S.wms[pid] || 0;
      const delta = newVal - oldVal;
      if (delta === 0) return;
      try {
        await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: {
            p_product_id: pid, p_delta: delta,
            p_reason: 'manual_edit', p_source: 'wms_tab',
            p_author: S.user?.email
          }
        });
        S.wms[pid] = newVal;
        toast('OK: ' + (delta > 0 ? '+' : '') + fmt(delta, 3));
      } catch (e) {
        inp.value = oldVal;
        toast('Ошибка: ' + e.message, 4000);
      }
    });
  });

  root.querySelectorAll('[data-wms-zero]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pid = +btn.dataset.wmsZero;
      const oldVal = S.wms[pid] || 0;
      if (oldVal === 0) return;
      if (!confirm('Обнулить остаток?')) return;
      try {
        await api('/rest/v1/rpc/apply_wms_delta', {
          method: 'POST',
          body: { p_product_id: pid, p_delta: -oldVal, p_reason: 'zeroed', p_source: 'wms_tab', p_author: S.user?.email }
        });
        S.wms[pid] = 0;
        renderWMS();
      } catch (e) { toast('Ошибка: ' + e.message, 4000); }
    });
  });

  const addBtn = document.getElementById('wms-add');
  if (addBtn) addBtn.addEventListener('click', addProductModal);
  const reloadBtn = document.getElementById('wms-reload');
  if (reloadBtn) reloadBtn.addEventListener('click', async () => { await loadAll(); renderWMS(); toast('OK'); });
}

function renderFact() {

  if (!activeTrips.length) {
    html += '<div class="empty">Нет активных походов. ' + (isBuyer ? 'Жди утверждения родителя.' : 'Создай и утверди поход во вкладке План.') + '</div>';
  } else {
    for (const t of activeTrips) {

function download(text, filename, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function extractJson(text) {
  // вырезаем \`\`\`json ... \`\`\` если есть
  let t = text.trim();
  const m = t.match(/\`\`\`(?:json)?\s*([\s\S]*?)\`\`\`/);
  if (m) t = m[1].trim();
  return t;
}

function validatePlan(data) {
  const trips = data.trips || data.plan || [];
  if (!Array.isArray(trips)) throw new Error('Нет поля trips[]');
  let total = 0, itemsCount = 0;
  for (const t of trips) {
    const items = t.items || [];
    itemsCount += items.length;
    for (const it of items) {
      total += +it.plan_price_total || (+it.target_qty * +it.plan_price_per_unit) || 0;
    }
  }
  return {
    trips: trips.length,
    items: itemsCount,
    total,
    first: trips[0] ? { date: trips[0].date, items: (trips[0].items || []).length } : null
  };
}

async function importPlan() {
  const data = S.wizardResult;
  if (!data) return;
  const trips = data.trips || [];
  if (!trips.length) { toast('Нет походов'); return; }

  // Найти существующие по дате (не cancelled)
  const existingByDate = {};
  for (const t of S.trips) {
    if (t.status !== 'cancelled') existingByDate[t.date] = t;
  }
  const newTrips = trips.filter(t => !existingByDate[t.date]);
  const dupTrips = trips.filter(t => existingByDate[t.date]);

  // Первый вопрос: добавлять новые?
  if (newTrips.length && !confirm('Добавить ' + newTrips.length + ' новых походов?')) return;

  // Второй вопрос: что делать с дублями?
  let updateExisting = false;
  if (dupTrips.length) {
    const dates = dupTrips.map(t => t.date).join(', ');
    const ask = 'Найдено ' + dupTrips.length + ' походов, которые уже есть в БД:\n' +
                dates + '\n\n' +
                'OK = ОБНОВИТЬ их (позиции заменятся свежими из JSON)\n' +
                'Отмена = ПРОПУСТИТЬ (оставить как есть)';
    updateExisting = confirm(ask);
  }

  let addedCount = 0;
  let updatedCount = 0;
  let skippedCount = 0;
  const errors = [];

  try {
    // 1) Обновление существующих
    if (updateExisting) {
      for (const t of dupTrips) {
        const existing = existingByDate[t.date];
        try {
          // удалить старые items
          await api('/rest/v1/trip_items?trip_id=eq.' + existing.id, {
            method: 'DELETE'
          });
          // обновить note
          await api('/rest/v1/trips?id=eq.' + existing.id, {
            method: 'PATCH',
            body: {
              kind: t.kind || 'fresh',
              note: t.note || null,
              budget_byn: t.budget_byn || null
            }
          });
          // залить новые items
          await importTripItems(existing.id, t.items || []);
          updatedCount++;
        } catch (e) {
          errors.push(t.date + ': ' + e.message);
        }
      }
    } else {
      skippedCount = dupTrips.length;
    }

    // 2) Добавление новых
    for (const t of newTrips) {
      try {
        const tripRes = await api('/rest/v1/trips', {
          method: 'POST', prefer: 'return=representation',
          body: {
            date: t.date,
            kind: t.kind || 'fresh',
            status: 'draft',
            budget_byn: t.budget_byn || null,
            note: t.note || null,
            created_by: S.user?.email
          }
        });
        const trip = tripRes[0];
        await importTripItems(trip.id, t.items || []);
        addedCount++;
      } catch (e) {
        errors.push(t.date + ': ' + e.message);
      }
    }

    await loadAll();
    renderPlan();

    let summary = '✅ ';
    if (addedCount) summary += 'Добавлено: ' + addedCount + '. ';
    if (updatedCount) summary += 'Обновлено: ' + updatedCount + '. ';
    if (skippedCount) summary += 'Пропущено: ' + skippedCount + '. ';
    if (errors.length) summary += '❌ Ошибок: ' + errors.length + '. ';

    document.getElementById('w-import').style.display = 'none';
    document.getElementById('w-in').value = '';
    document.getElementById('w-preview').innerHTML =
      '<div class="card" style="background:var(--card2);color:var(--green)">' +
      esc(summary) +
      (errors.length ? '<pre style="font-size:10px;color:var(--red);margin-top:8px">' + esc(errors.join('\n')) + '</pre>' : '') +
      '</div>';
    toast('Импорт OK: +' + addedCount + ' / ~' + updatedCount);
  } catch (e) {
    toast('Ошибка импорта: ' + e.message, 5000);
  }
}

async function importTripItems(tripId, items) {
  for (const it of items) {
    const name = (it.name || '').trim();
    if (!name) continue;
    let prod = S.products.find(p =>
      p.name.toLowerCase() === name.toLowerCase() &&
      (p.brand || '').toLowerCase() === (it.brand || '').toLowerCase()
    );
    if (!prod) {
      const pr = await api('/rest/v1/products', {
        method: 'POST', prefer: 'return=representation',
        body: {
          name, brand: it.brand || null,
          unit: it.unit || 'шт',
          category: it.category || null,
          search_url: it.search_url || null
        }
      });
      prod = pr[0];
      S.products.push(prod);
    }
    const qty = +it.target_qty || 0;
    const ppu = +it.plan_price_per_unit || 0;
    const total = +it.plan_price_total || (qty * ppu);
    await api('/rest/v1/trip_items', {
      method: 'POST', prefer: 'return=minimal',
      body: {
        trip_id: tripId, product_id: prod.id,
        target_qty: qty, unit: it.unit || prod.unit,
        plan_price_per_unit: ppu, plan_price_total: total
      }
    });
  }
}

    </div>
    <div class="card">
      <h2>💾 Локальный черновик факта</h2>
      <p class="muted">Пока ты не закрыл поход, фактические цены/веса хранятся только в твоём браузере (localStorage). Это чтобы можно было работать в магазине без связи.</p>
      <button class="btn" id="sync-clear-draft">Очистить локальный черновик</button>
    </div>
    <div class="card">
      <h2>ℹ️ Сведения</h2>
      <div class="muted">
        <div>Сервер: <b>${CFG.url}</b></div>
        <div>Пользователь: <b>${esc(S.user?.email || '')}</b></div>
        <div>Роль: <b>${esc(S.role || '')}</b></div>
        <div>Версия: 1.0</div>
      </div>
    </div>
  `;
  document.getElementById('sync-reload').addEventListener('click', async () => {
    await loadAll(); renderPlan(); toast('Обновлено');
  });
  document.getElementById('sync-logout').addEventListener('click', () => {
    if (confirm('Выйти?')) logout();
  });
  document.getElementById('sync-clear-draft').addEventListener('click', () => {
    if (!confirm('Очистить локальный черновик?')) return;
    localStorage.removeItem(LS_CACHE);
    for (const it of S.tripItems) { delete it._bought; delete it._fact_price; delete it._fact_weight; }
    toast('Черновик очищен');
  });
}

// ================= NAVIGATION =================
const renderers = {
  plan: renderPlan,
  wms: renderWMS,
  fact: renderFact,
  audit: renderAudit,
  wizard: renderWizard,
  sync: renderSync,
};

function switchTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('tab-' + name);
  if (target) target.classList.add('active');
  if (renderers[name]) renderers[name]();
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) switchTab(btn.dataset.tab);
});

// ================= STARTUP =================
async function boot() {
  const ok = await refreshIfNeeded();
  if (!ok) {
    document.getElementById('tab-login').classList.add('active');
    bindLogin();
    return;
  }
  await enterApp();
}

function bindLogin() {
  const btn = document.getElementById('li-btn');
  const msg = document.getElementById('li-msg');
  const doLogin = async () => {
    const email = document.getElementById('li-email').value.trim();
    const pass = document.getElementById('li-pass').value;
    if (!email || !pass) { msg.textContent = 'Заполни email и пароль'; return; }
    btn.disabled = true; msg.textContent = 'Вход...';
    try {
      await login(email, pass);
      msg.textContent = '';
      await enterApp();
    } catch (e) {
      msg.textContent = e.message;
      btn.disabled = false;
    }
  };
  btn.addEventListener('click', doLogin);
  document.getElementById('li-pass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
}

async function enterApp() {
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-login').classList.remove('active');
  const tabsEl = document.getElementById('tabs');
  tabsEl.style.display = 'flex';

  // Скрываем вкладки по роли
  if (S.role === 'buyer') {
    // buyer видит только Факт
    tabsEl.querySelectorAll('button[data-tab]').forEach(b => {
      b.style.display = (b.dataset.tab === 'fact') ? 'block' : 'none';
    });
  } else {
    // admin видит всё
    tabsEl.querySelectorAll('button[data-tab]').forEach(b => b.style.display = 'block');
  }

  const roleName = S.role === 'admin' ? '👨‍👩‍👧 Родитель' : '🛒 Покупатель';
  document.getElementById('who').innerHTML = '<b>' + esc(S.user?.email || '') + '</b> · ' + roleName;

  try {
    await loadAll();
    loadFactDraft();
  } catch (e) {
    toast('Ошибка загрузки: ' + e.message, 5000);
  }

  const first = S.role === 'buyer' ? 'fact' : 'plan';
  switchTab(first);
}
// Глобально
window.closeModal = closeModal;
boot();
</script>
</body>
</html>
